<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خزنة أسراري 🔐</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --bg: #f9fafb; --text: #374151; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); }
        
        /* شاشة الدخول */
        #loginOverlay { position: fixed; inset: 0; background: #f0f2f5; z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        .google-btn { background: #1a73e8; color: white; border: none; padding: 15px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 20px; }
        
        /* واجهة التطبيق */
        header { height: 70px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #eee; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .app-input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 15px; outline: none; box-sizing: border-box; font-size: 16px; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        .btn-vault { background: white; color: var(--primary); border: 2px solid var(--primary); padding: 12px; border-radius: 12px; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; }
        
        /* صفحة المحفوظات */
        #vaultPage { position: fixed; inset: 0; background: white; z-index: 500; display: none; flex-direction: column; }
        .vault-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #vaultList { flex: 1; overflow-y: auto; padding: 20px; }
        .card { background: #f3f4f6; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; opacity: 0; transition: 0.3s; pointer-events: none; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>خزنة أسراري 🔒</h2>
        <p>يرجى تسجيل الدخول لحماية ملاحظاتك</p>
        <button id="loginBtn" class="google-btn">الدخول عبر Google</button>
        <div id="loginStatus" style="margin-top:15px; display:none; color: var(--primary);">جاري التحويل...</div>
    </div>
</div>

<header>
    <button onclick="logout()" style="background:none; border:none; font-size:20px; cursor:pointer;">🚪</button>
    <h1 style="font-size:18px; margin:0;">خزنتي السحابية</h1>
    <div style="width:30px;"></div>
</header>

<div class="container">
    <input type="text" id="titleInput" class="app-input" placeholder="العنوان (مثلاً: حساب فيسبوك)">
    <input type="text" id="passInput" class="app-input" placeholder="كلمة المرور أو الملاحظة">
    <button class="btn-save" onclick="saveData()">حفظ في السحابة ☁️</button>
    <button class="btn-vault" onclick="openVault()">📂 عرض المحفوظات</button>
</div>

<div id="vaultPage">
    <div class="vault-header">
        <h2 style="margin:0;">محفوظاتي</h2>
        <button onclick="closeVault()" style="background:#eee; border:none; padding:10px 20px; border-radius:8px;">إغلاق</button>
    </div>
    <div id="vaultList"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMLMIUht6Az9R1-kiJeNGVN0BeL1N5rG4",
      authDomain: "wassouf1997.firebaseapp.com",
      databaseURL: "https://wassouf1997-default-rtdb.firebaseio.com",
      projectId: "wassouf1997",
      storageBucket: "wassouf1997.firebasestorage.app",
      messagingSenderId: "979816526016",
      appId: "1:979816526016:web:a0538d0d686bf2ff123d25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let myData = [];

    // تسجيل الدخول
    document.getElementById('loginBtn').onclick = () => {
        document.getElementById('loginStatus').style.display = 'block';
        signInWithRedirect(auth, provider);
    };

    // خروج
    window.logout = () => { if(confirm("هل تريد تسجيل الخروج؟")) signOut(auth).then(() => window.location.reload()); };

    // مراقب الحالة
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginOverlay').style.display = 'none';
            listenToData(user.uid);
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
        }
    });

    // جلب البيانات الخاصة بالمستخدم فقط
    function listenToData(uid) {
        onValue(ref(db, 'users/' + uid), (snapshot) => {
            const data = snapshot.val();
            myData = data ? data.items || [] : [];
            renderUI();
        });
    }

    // حفظ البيانات
    window.saveData = () => {
        const title = document.getElementById('titleInput').value;
        const pass = document.getElementById('passInput').value;
        if(!title || !pass) return showToast("يرجى ملء الحقول");
        
        myData.push({ title, pass, id: Date.now() });
        set(ref(db, 'users/' + currentUser.uid), { items: myData }).then(() => {
            showToast("تم الحفظ بأمان ✅");
            document.getElementById('titleInput').value = '';
            document.getElementById('passInput').value = '';
        });
    };

    function renderUI() {
        const list = document.getElementById('vaultList');
        if (myData.length === 0) { list.innerHTML = '<p style="text-align:center; color:#999;">لا توجد محفوظات بعد</p>'; return; }
        list.innerHTML = myData.map(item => `
            <div class="card">
                <strong>${item.title}</strong><br>
                <code style="color:var(--primary); font-size:16px;">${item.pass}</code>
            </div>
        `).join('');
    }

    window.openVault = () => document.getElementById('vaultPage').style.display = 'flex';
    window.closeVault = () => document.getElementById('vaultPage').style.display = 'none';
    
    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2000);
    }
</script>
</body>
</html>
