<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* عناصر النموذج */
        input, select, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: none; box-sizing: border-box; outline: none; font-size: 1rem; }
        input, select { background: #334155; color: white; border: 1px solid transparent; transition: 0.3s; }
        input:focus { border-color: #3b82f6; background: #475569; }
        
        /* الأزرار */
        .add-btn { background: linear-gradient(45deg, #2563eb, #3b82f6); color: white; font-weight: bold; cursor: pointer; }
        .add-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }
        
        /* القائمة */
        .app-item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; margin-top: 10px; border-radius: 10px; text-align: right; border: 1px solid rgba(255,255,255,0.05); }
        .delete-btn { background: #ef4444; color: white; width: auto; padding: 8px 15px; margin: 0; font-size: 0.85rem; cursor: pointer; }
        .delete-btn:hover { background: #dc2626; }

        /* --- تصميم النافذة المنبثقة (Modal) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-box {
            background: #1e293b; padding: 25px; border-radius: 15px; width: 90%; max-width: 350px;
            text-align: center; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: popIn 0.3s ease;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-yes { background: #ef4444; color: white; }
        .btn-no { background: #475569; color: white; }

        /* --- تصميم الإشعار (Toast) --- */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #10b981; color: #fff;
            text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 1;
            left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div id="toast">✅ تم تنفيذ العملية بنجاح</div>

<div id="confirmModal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin-top:0">تأكيد الحذف</h3>
        <p style="color:#cbd5e1;">هل أنت متأكد أنك تريد حذف هذا التطبيق نهائياً؟</p>
        <div class="modal-buttons">
            <button class="btn-yes" onclick="confirmDelete()">نعم، احذف</button>
            <button class="btn-no" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<div class="box">
    <div id="loginArea">
        <h2>🔐 دخول المدير</h2>
        <button onclick="login()" style="background:#ea4335; color:white;">تسجيل الدخول عبر Google</button>
    </div>

    <div id="adminArea" style="display:none;">
        <h3>👋 أهلاً بك يا مدير!</h3>
        
        <input type="text" id="appName" placeholder="اسم التطبيق">
        <input type="text" id="appLink" placeholder="رابط التحميل">
        <input type="text" id="appImg" placeholder="رابط الصورة">
        <select id="appType">
            <option value="MOD">تطبيق معدل (MOD)</option>
            <option value="PDF">كتاب (PDF)</option>
            <option value="GAME">لعبة (GAME)</option>
        </select>
        <button class="add-btn" onclick="addApp()">🚀 نشر التطبيق</button>

        <hr style="border-color: #334155; margin: 25px 0;">

        <h4 style="text-align: right; margin-bottom:10px;">📦 التطبيقات المنشورة:</h4>
        <div id="appsList">
            <p style="color:gray; font-size:0.8rem;">جاري جلب البيانات...</p>
        </div>
        
        <button onclick="logout()" style="background:transparent; color:#64748b; font-size:12px; margin-top:20px;">تسجيل خروج</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
        authDomain: "mohammadalboushi-e9231.firebaseapp.com",
        projectId: "mohammadalboushi-e9231",
        databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
        appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // UID الخاص بك
    const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2";

    // متغير لتخزين معرف التطبيق المراد حذفه مؤقتاً
    let targetDeleteKey = null;

    onAuthStateChanged(auth, (user) => {
        if (user && user.uid === myUID) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('adminArea').style.display = 'block';
            loadApps();
        } else {
            document.getElementById('loginArea').style.display = 'block';
            document.getElementById('adminArea').style.display = 'none';
        }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    // إضافة تطبيق
    window.addApp = () => {
        const name = document.getElementById('appName').value;
        const link = document.getElementById('appLink').value;
        const img = document.getElementById('appImg').value;
        const type = document.getElementById('appType').value;
        
        if(name && link) {
            push(ref(db, 'apps'), { 
                name, link, img: img || 'https://cdn-icons-png.flaticon.com/512/564/564619.png', type 
            })
            .then(() => { 
                showToast("✅ تم نشر التطبيق بنجاح!");
                document.querySelectorAll('input').forEach(i => i.value = '');
            });
        } else {
            showToast("⚠️ يرجى كتابة الاسم والرابط", "#ef4444");
        }
    };

    // تحميل القائمة
    function loadApps() {
        const appsRef = ref(db, 'apps');
        onValue(appsRef, (snapshot) => {
            const list = document.getElementById('appsList');
            list.innerHTML = "";
            const data = snapshot.val();

            if (data) {
                const entries = Object.entries(data).reverse();
                entries.forEach(([key, val]) => {
                    const item = document.createElement('div');
                    item.className = 'app-item';
                    item.innerHTML = `
                        <div class="app-info">
                            <strong style="color:#f8fafc">${val.name}</strong><br>
                            <span style="font-size:0.7rem; color:#94a3b8;">${val.type}</span>
                        </div>
                        <button class="delete-btn" onclick="askDelete('${key}')">🗑️ حذف</button>
                    `;
                    list.appendChild(item);
                });
            } else {
                list.innerHTML = "<p style='color:#64748b'>لا توجد تطبيقات</p>";
            }
        });
    }

    // --- منطق النافذة المنبثقة ---
    
    // 1. فتح النافذة عند الضغط على زر الحذف
    window.askDelete = (key) => {
        targetDeleteKey = key; // حفظ المعرف
        document.getElementById('confirmModal').style.display = 'flex';
    };

    // 2. إغلاق النافذة
    window.closeModal = () => {
        targetDeleteKey = null;
        document.getElementById('confirmModal').style.display = 'none';
    };

    // 3. تنفيذ الحذف عند الضغط على "نعم"
    window.confirmDelete = () => {
        if (targetDeleteKey) {
            remove(ref(db, 'apps/' + targetDeleteKey))
            .then(() => {
                showToast("🗑️ تم حذف التطبيق");
                closeModal();
            });
        }
    };

    // دالة عرض الإشعار الجميل
    function showToast(text, color = "#10b981") {
        const x = document.getElementById("toast");
        x.innerText = text;
        x.style.backgroundColor = color;
        x.className = "show";
        setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

</script>
</body>
</html>
