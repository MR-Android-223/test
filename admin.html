<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin V5.0 | Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg-body: #0f172a; --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
            --card-glass: rgba(30, 41, 59, 0.98); --text-main: #f8fafc; --text-muted: #94a3b8;
            --primary: #3b82f6; --danger: #ef4444; --border: rgba(255,255,255,0.08);
            --grid-cols: 2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); background-image: var(--bg-gradient); color: var(--text-main); font-family: 'Cairo', sans-serif; min-height: 100vh; padding-bottom: 100px; }

        /* General UI */
        header { position: sticky; top: 0; z-index: 1000; background: rgba(15, 23, 42, 0.98); border-bottom: 1px solid var(--border); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header-btn { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); padding: 8px 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .header-btn:active { transform: scale(0.95); }
        .header-left { display: flex; gap: 8px; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: 10px; padding: 10px 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card-glass); border-radius: 16px; padding: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; position: relative; height: 100%; }
        .card img { width: 55px; height: 55px; border-radius: 12px; margin-bottom: 8px; object-fit: cover; background: #334155; pointer-events: none; }
        .card-title { font-size: 0.8rem; font-weight: 700; text-align: center; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; width: 100%; }
        
        .drag-handle { position: absolute; top: 0; right: 0; padding: 10px; color: #64748b; cursor: grab; z-index: 5; }
        .card.selected { border: 2px solid var(--primary); background: rgba(59, 130, 246, 0.15); }
        
        /* Fab & Tabs */
        .fab-btn { position: fixed; bottom: 30px; left: 30px; width: 55px; height: 55px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4); cursor: pointer; z-index: 2000; border: none; }
        .tabs-wrapper { position: sticky; top: 68px; z-index: 900; background: linear-gradient(to bottom, rgba(15,23,42,1), rgba(15,23,42,0)); padding: 10px 0; }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; }
        .tab-btn { background: var(--card-glass); color: var(--text-muted); border: 1px solid var(--border); padding: 6px 16px; border-radius: 50px; cursor: pointer; white-space: nowrap; font-weight: bold; font-size: 0.8rem; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1e293b; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; }
        .btn-full { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        
        /* Sort Menu */
        .sort-dropdown { position: absolute; top: 60px; left: 20px; background: #1e293b; border: 1px solid var(--border); border-radius: 10px; width: 160px; display: none; z-index: 1100; }
        .sort-item { padding: 10px; color: #cbd5e1; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .sort-item:hover { color: var(--primary); background: rgba(255,255,255,0.05); }

        /* Search Results */
        .search-result-item { display: flex; gap: 10px; padding: 10px; background: #334155; margin-bottom: 8px; border-radius: 10px; cursor: pointer; text-align: right; align-items: center; }
        .search-result-item img { width: 40px; height: 40px; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:900;">Admin<span style="color:var(--primary)">Pro</span></div>
        <div class="header-left">
            <button class="header-btn" onclick="toggleSortMenu()"><i class="fas fa-sort"></i></button>
            <div id="sortMenu" class="sort-dropdown">
                <div class="sort-item" onclick="changeSort('MANUAL')">✋ ترتيب يدوي (للزوار)</div>
                <div class="sort-item" onclick="changeSort('DATE')">📅 آخر تعديل</div>
                <div class="sort-item" onclick="changeSort('AZ')">🔤 أبجدياً A-Z</div>
            </div>
            
            <button class="header-btn" onclick="toggleLayout()"><i class="fas fa-columns"></i> <span id="layoutNum">2</span></button>
            <button onclick="openSettingsModal()" class="header-btn"><i class="fas fa-cog"></i></button>
            <button onclick="login()" id="loginBtn" class="header-btn" style="background:#ea4335; display:none;">Login</button>
        </div>
    </header>

    <div class="tabs-wrapper"><div class="tabs-container" id="tabsList"></div></div>
    
    <div class="grid" id="appsContainer">
        <div style="grid-column: span 2; text-align: center; color: #94a3b8; margin-top: 50px;">جاري التحميل...</div>
    </div>

    <button class="fab-btn" onclick="openAddChoiceModal()">+</button>

    <!-- Modals -->
    <div id="addChoiceModal" class="modal-overlay">
        <div class="modal-box">
            <h3>إضافة تطبيق</h3>
            <button onclick="openStoreSearch()" class="btn-full" style="background: #10b981; color: white;"><i class="fab fa-google-play"></i> جلب من المتجر</button>
            <button onclick="openEditModal()" class="btn-full" style="background: #3b82f6; color: white;"><i class="fas fa-pen"></i> إضافة يدوية</button>
            <button onclick="closeModal('addChoiceModal')" class="btn-full" style="background:transparent; color:#94a3b8; border:1px solid #334155">إلغاء</button>
        </div>
    </div>

    <div id="storeSearchModal" class="modal-overlay">
        <div class="modal-box">
            <h3>بحث خارجي (سريع)</h3>
            <input type="text" id="storeSearchInput" placeholder="اسم التطبيق (مثلاً: PUBG)...">
            <button onclick="searchStore()" class="btn-full" style="background:var(--primary); color:white">بحث</button>
            <div id="storeSearchResults" style="max-height: 250px; overflow-y: auto; margin-top: 10px;"></div>
            <button onclick="closeModal('storeSearchModal')" class="btn-full" style="margin-top:10px; background:transparent; color:#94a3b8;">إغلاق</button>
        </div>
    </div>

    <div id="appModal" class="modal-overlay">
        <div class="modal-box">
            <h3>بيانات التطبيق</h3>
            <select id="appCat"></select>
            <input type="text" id="appName" placeholder="الاسم">
            <input type="text" id="appImgUrl" placeholder="رابط الصورة" style="direction:ltr">
            <div style="display:flex; justify-content:center; margin:5px;"><img id="previewImg" style="width:60px; height:60px; border-radius:10px; display:none;"></div>
            <input type="text" id="appLink" placeholder="رابط التحميل (Play Store)" style="direction:ltr">
            
            <div style="display:flex; align-items:center; justify-content:space-between; margin:10px 0; color:#cbd5e1;">
                <span>إخفاء؟</span> <input type="checkbox" id="appHidden" style="width:20px; margin:0;">
            </div>
            
            <button onclick="saveApp()" id="saveBtn" class="btn-full" style="background:var(--primary); color:white">حفظ</button>
            <button onclick="deleteSingleApp()" id="delBtn" class="btn-full" style="background:var(--danger); color:white; display:none;">حذف</button>
            <button onclick="closeModal('appModal')" class="btn-full" style="background:transparent; color:#94a3b8;">إغلاق</button>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <h3>الإعدادات</h3>
            <button onclick="openSection('catLock')" class="btn-full" style="background:#334155; color:white">🔒 قفل الأقسام</button>
            <button onclick="openSection('texts')" class="btn-full" style="background:#334155; color:white">📝 النصوص والخطوط</button>
            <button onclick="openSection('sidebar')" class="btn-full" style="background:#334155; color:white">👤 السايدبار</button>
            <button onclick="closeModal('settingsModal')" class="btn-full" style="margin-top:10px; border:1px solid #475569; color:#94a3b8; background:transparent">إغلاق</button>
        </div>
    </div>

    <!-- Sub-Settings Sections (Hidden by default, loaded dynamically via JS if needed, but for simplicity we keep basic logic) -->
    <div id="catLockModal" class="modal-overlay">
        <div class="modal-box">
            <h3>إدارة الأقسام</h3>
            <div id="catLockList" style="max-height:300px; overflow-y:auto; text-align:right;"></div>
            <button onclick="closeModal('catLockModal')" class="btn-full" style="margin-top:10px;">رجوع</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, update, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI", authDomain: "mohammadalboushi-e9231.firebaseapp.com", projectId: "mohammadalboushi-e9231", databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/", appId: "1:236925802081:web:2e26094ab5ecdf988f3c20" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2";

        let allApps = {};
        let allCats = {};
        let currentFilter = 'ALL';
        let sortMethod = 'DATE'; // DATE, AZ, MANUAL
        let gridCols = 2;
        let editKey = null;
        let appSortable = null;

        onAuthStateChanged(auth, u => {
            if(u && u.uid === myUID) { document.getElementById('loginBtn').style.display='none'; init(); }
            else { document.getElementById('loginBtn').style.display='flex'; }
        });
        window.login = () => signInWithPopup(auth, new GoogleAuthProvider());

        function init() {
            onValue(ref(db, 'categories'), s => {
                allCats = s.val() || {'PROGRAM':{name:'تطبيقات',icon:'📱',order:1}};
                renderTabs();
            });
            onValue(ref(db, 'apps'), s => {
                allApps = s.val() || {};
                renderApps();
            });
        }

        window.renderTabs = () => {
            const c = document.getElementById('tabsList');
            const sel = document.getElementById('appCat');
            let h = `<button class="tab-btn ${currentFilter==='ALL'?'active':''}" onclick="setFilter('ALL')">🌟 الكل</button>`;
            let op = '';
            Object.entries(allCats).sort(([,a],[,b])=>a.order-b.order).forEach(([k,v])=>{
                h += `<button class="tab-btn ${currentFilter===k?'active':''}" onclick="setFilter('${k}')">${v.isHidden?'🔒':''} ${v.icon} ${v.name}</button>`;
                op += `<option value="${k}">${v.name}</option>`;
            });
            c.innerHTML = h; sel.innerHTML = op;
            if(allCats['PROGRAM']) sel.value = 'PROGRAM';
        }
        window.setFilter = f => { currentFilter=f; renderTabs(); renderApps(); }

        function renderApps() {
            const container = document.getElementById('appsContainer');
            // Use DocumentFragment for performance
            const fragment = document.createDocumentFragment();
            
            let arr = Object.entries(allApps);
            
            // Sorting Logic
            if(sortMethod === 'DATE') arr.sort(([,a],[,b]) => (b.lastModified||0)-(a.lastModified||0));
            else if(sortMethod === 'AZ') arr.sort(([,a],[,b]) => a.name.localeCompare(b.name));
            else arr.sort(([,a],[,b]) => (a.order||0)-(b.order||0));

            arr.forEach(([k,v]) => {
                if(currentFilter !== 'ALL' && v.type !== currentFilter) return;
                
                const div = document.createElement('div');
                div.className = 'card';
                div.setAttribute('data-key', k);
                div.style.opacity = v.isHidden ? '0.5' : '1';
                div.onclick = (e) => {
                    if(!e.target.closest('.drag-handle')) openEditModal(k,v);
                };

                div.innerHTML = `
                    ${sortMethod==='MANUAL' ? '<div class="drag-handle"><i class="fas fa-bars"></i></div>' : ''}
                    <img src="${v.img}" loading="lazy">
                    <div class="card-title">${v.name}</div>
                `;
                fragment.appendChild(div);
            });

            container.innerHTML = '';
            container.appendChild(fragment);

            if(appSortable) appSortable.destroy();
            if(sortMethod === 'MANUAL') {
                appSortable = new Sortable(container, {
                    handle: '.drag-handle', animation: 150,
                    onEnd: () => {
                        const updates = {};
                        [...container.children].forEach((el, i) => {
                            updates[`apps/${el.getAttribute('data-key')}/order`] = i;
                        });
                        update(ref(db), updates);
                    }
                });
            }
        }

        // --- Store Search (Smart Link Logic) ---
        window.openStoreSearch = () => { closeModal('addChoiceModal'); document.getElementById('storeSearchModal').style.display='flex'; }
        
        window.searchStore = async () => {
            const q = document.getElementById('storeSearchInput').value;
            const resDiv = document.getElementById('storeSearchResults');
            resDiv.innerHTML = 'جاري البحث...';
            
            try {
                // Using corsproxy.io for speed
                const url = `https://corsproxy.io/?` + encodeURIComponent(`https://itunes.apple.com/search?term=${q}&entity=software&limit=10&country=SA`);
                const req = await fetch(url);
                const data = await req.json();
                
                resDiv.innerHTML = '';
                if(!data.results.length) { resDiv.innerHTML = 'لا توجد نتائج'; return; }

                data.results.forEach(app => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.onclick = () => {
                        // Smart Logic: Create Play Store link from Bundle ID
                        const playLink = `https://play.google.com/store/apps/details?id=${app.bundleId}`;
                        
                        closeModal('storeSearchModal');
                        openEditModal(null);
                        document.getElementById('appName').value = app.trackName;
                        document.getElementById('appImgUrl').value = app.artworkUrl512 || app.artworkUrl100;
                        document.getElementById('appLink').value = playLink; // Auto-filled!
                        document.getElementById('previewImg').src = app.artworkUrl100;
                        document.getElementById('previewImg').style.display = 'block';
                    };
                    item.innerHTML = `<img src="${app.artworkUrl60}"> <div><div style="font-weight:bold">${app.trackName}</div><div style="font-size:0.7rem">${app.artistName}</div></div>`;
                    resDiv.appendChild(item);
                });
            } catch(e) { resDiv.innerHTML = 'خطأ في الاتصال'; console.log(e); }
        }

        // --- CRUD & UI ---
        window.openEditModal = (k,v) => {
            closeModal('addChoiceModal');
            document.getElementById('appModal').style.display='flex';
            if(k) {
                editKey=k; document.getElementById('appName').value=v.name; document.getElementById('appLink').value=v.link;
                document.getElementById('appImgUrl').value=v.img; document.getElementById('appCat').value=v.type;
                document.getElementById('appHidden').checked=v.isHidden; document.getElementById('previewImg').src=v.img;
                document.getElementById('delBtn').style.display='block';
            } else {
                editKey=null; document.getElementById('appName').value=''; document.getElementById('appLink').value='';
                document.getElementById('appImgUrl').value=''; document.getElementById('previewImg').style.display='none';
                document.getElementById('delBtn').style.display='none';
            }
        }

        window.saveApp = () => {
            const d = {
                name: document.getElementById('appName').value,
                link: document.getElementById('appLink').value,
                img: document.getElementById('appImgUrl').value,
                type: document.getElementById('appCat').value,
                isHidden: document.getElementById('appHidden').checked,
                lastModified: Date.now()
            };
            if(!d.name || !d.img) return alert("الاسم والصورة مطلوبان");
            
            if(editKey) {
                // Keep order if exists
                d.order = allApps[editKey].order || 0;
                update(ref(db, 'apps/'+editKey), d);
            } else {
                d.order = 9999; 
                push(ref(db, 'apps'), d);
            }
            closeModal('appModal');
        }

        window.deleteSingleApp = () => { if(confirm('حذف؟')) remove(ref(db,'apps/'+editKey)); closeModal('appModal'); }

        // --- Settings & Cat Lock ---
        window.openSection = (sec) => {
            if(sec === 'catLock') {
                document.getElementById('catLockModal').style.display='flex';
                const lst = document.getElementById('catLockList'); lst.innerHTML='';
                Object.entries(allCats).forEach(([k,v])=>{
                    const isLocked = v.isHidden===true;
                    const item = document.createElement('div');
                    item.style.cssText = "padding:10px; background:#0f172a; margin-bottom:5px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;";
                    item.innerHTML = `<span>${v.icon} ${v.name}</span> <i class="fas ${isLocked?'fa-lock':'fa-lock-open'}" style="color:${isLocked?'#f59e0b':'#10b981'}; cursor:pointer"></i>`;
                    item.querySelector('i').onclick = () => {
                        update(ref(db, `categories/${k}/isHidden`), !isLocked);
                        // UI update handled by Firebase listener, but let's force re-render logic if needed.
                    };
                    lst.appendChild(item);
                });
            } else {
                alert("تم تبسيط الكود: يمكنك إضافة باقي الإعدادات هنا بنفس الطريقة");
            }
        }

        // --- Utils ---
        window.toggleLayout = () => { gridCols = gridCols>=3 ? 1 : gridCols+1; document.documentElement.style.setProperty('--grid-cols', gridCols); document.getElementById('layoutNum').innerText=gridCols; }
        window.toggleSortMenu = () => { const m=document.getElementById('sortMenu'); m.style.display=m.style.display==='block'?'none':'block'; }
        window.changeSort = (m) => { sortMethod=m; document.getElementById('sortMenu').style.display='none'; renderApps(); }
        window.closeModal = id => document.getElementById(id).style.display='none';
        window.openAddChoiceModal = () => document.getElementById('addChoiceModal').style.display='flex';
        window.openSettingsModal = () => document.getElementById('settingsModal').style.display='flex';
    </script>
</body>
</html>
