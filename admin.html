<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم V10 | الاحترافية الكاملة</title>
    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); text-align: center; margin: 0; padding: 20px; }
        .box { background: var(--card); padding: 30px; border-radius: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: none; outline: none; font-size: 1rem; box-sizing: border-box; }
        input, select { background: #334155; color: white; border: 1px solid transparent; }
        input:focus { border-color: var(--primary); }
        .main-btn { background: linear-gradient(45deg, #2563eb, #3b82f6); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .main-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* قسم الصورة */
        .upload-area { border: 2px dashed #334155; padding: 20px; border-radius: 12px; margin: 10px 0; cursor: pointer; position: relative; }
        #previewImg { width: 80px; height: 80px; border-radius: 15px; object-fit: cover; display: none; margin: 10px auto; border: 2px solid var(--primary); }
        
        /* البحث والقائمة */
        #searchBar { background: var(--bg); border: 1px solid #334155; margin-bottom: 20px; }
        .app-item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; margin-top: 10px; border-radius: 12px; }
        .btn-group { display: flex; gap: 8px; }
        .sm-btn { width: auto; padding: 8px 15px; margin: 0; font-size: 0.8rem; cursor: pointer; }
        .edit-btn { background: #f59e0b; color: white; }
        .del-btn { background: #ef4444; color: white; }

        /* التنبيهات */
        #toast { visibility: hidden; min-width: 200px; background: #10b981; color: white; padding: 15px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); border-radius: 50px; z-index: 2000; }
        #toast.show { visibility: visible; animation: fade 0.5s; }
        @keyframes fade { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    </style>
</head>
<body>

<div id="toast">✅ تم بنجاح</div>

<div class="box">
    <div id="loginArea">
        <h2>🔐 دخول المدير</h2>
        <button onclick="login()" style="background:#ea4335; color:white;">تسجيل الدخول عبر Google</button>
    </div>

    <div id="adminArea" style="display:none;">
        <h3 id="formTitle">✨ إضافة تطبيق جديد</h3>
        
        <input type="text" id="appName" placeholder="اسم التطبيق">
        <input type="text" id="appLink" placeholder="رابط التحميل المباشر">
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span id="uploadLabel">📸 اضغط لاختيار صورة</span>
            <input type="file" id="fileInput" hidden accept="image/*" onchange="previewImage()">
            <img id="previewImg">
        </div>

        <select id="appType">
            <option value="MOD">تطبيق معدل (MOD)</option>
            <option value="GAME">لعبة (GAME)</option>
            <option value="PDF">كتاب (PDF)</option>
        </select>
        
        <button id="saveBtn" class="main-btn" onclick="handleProcess()">🚀 نشر الآن</button>
        <button id="cancelBtn" style="display:none; background:#475569; color:white;" onclick="resetForm()">إلغاء</button>

        <hr style="border-color:#334155; margin:30px 0;">
        
        <input type="text" id="searchBar" placeholder="🔍 ابحث في تطبيقاتك..." onkeyup="filterApps()">
        <div id="appsList">جاري التحميل...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
        authDomain: "mohammadalboushi-e9231.firebaseapp.com",
        projectId: "mohammadalboushi-e9231",
        databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
        appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();
    const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2";

    let editKey = null;
    let currentImgUrl = "";

    onAuthStateChanged(auth, (user) => {
        if (user && user.uid === myUID) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('adminArea').style.display = 'block';
            loadData();
        }
    });

    window.login = () => signInWithPopup(auth, provider);

    window.previewImage = () => {
        const file = document.getElementById('fileInput').files[0];
        if (file) {
            document.getElementById('previewImg').style.display = 'block';
            document.getElementById('previewImg').src = URL.createObjectURL(file);
            document.getElementById('uploadLabel').innerText = "تم اختيار الصورة ✅";
        }
    };

    // دالة الرفع الذكية (تستخدم خدمة رفع مجانية وسريعة)
    async function uploadToCloud(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'ml_default'); // بريست افتراضي للرفع السريع
        
        const res = await fetch('https://api.cloudinary.com/v1_1/demo/image/upload', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        return data.secure_url;
    }

    window.handleProcess = async () => {
        const name = document.getElementById('appName').value;
        const link = document.getElementById('appLink').value;
        const type = document.getElementById('appType').value;
        const file = document.getElementById('fileInput').files[0];
        const btn = document.getElementById('saveBtn');

        if (!name || !link) return alert("املأ البيانات!");

        btn.disabled = true;
        btn.innerText = "⏳ جاري الرفع والنشر...";

        try {
            let imgUrl = currentImgUrl || "https://cdn-icons-png.flaticon.com/512/564/564619.png";
            if (file) {
                imgUrl = await uploadToCloud(file);
            }

            const data = { name, link, img: imgUrl, type };

            if (editKey) {
                await update(ref(db, 'apps/' + editKey), data);
                msg("✅ تم التعديل");
            } else {
                await push(ref(db, 'apps'), data);
                msg("🚀 تم النشر");
            }
            resetForm();
        } catch (e) { alert("حدث خطأ!"); }
        btn.disabled = false;
        btn.innerText = "🚀 نشر الآن";
    };

    function loadData() {
        onValue(ref(db, 'apps'), (s) => {
            const list = document.getElementById('appsList');
            list.innerHTML = "";
            const val = s.val();
            if (val) {
                Object.entries(val).reverse().forEach(([k, v]) => {
                    const div = document.createElement('div');
                    div.className = 'app-item';
                    div.setAttribute('data-name', v.name.toLowerCase());
                    div.innerHTML = `
                        <div style="text-align:right">
                            <strong>${v.name}</strong><br><small>${v.type}</small>
                        </div>
                        <div class="btn-group">
                            <button class="sm-btn edit-btn" onclick="startEdit('${k}','${v.name}','${v.link}','${v.img}','${v.type}')">✏️</button>
                            <button class="sm-btn del-btn" onclick="del('${k}')">🗑️</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
        });
    }

    window.startEdit = (k, n, l, i, t) => {
        editKey = k; currentImgUrl = i;
        document.getElementById('appName').value = n;
        document.getElementById('appLink').value = l;
        document.getElementById('appType').value = t;
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('previewImg').src = i;
        document.getElementById('formTitle').innerText = "✏️ تعديل التطبيق";
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo(0,0);
    };

    window.resetForm = () => {
        editKey = null; currentImgUrl = "";
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('previewImg').style.display = 'none';
        document.getElementById('formTitle').innerText = "✨ إضافة تطبيق جديد";
        document.getElementById('uploadLabel').innerText = "📸 اضغط لاختيار صورة";
        document.getElementById('cancelBtn').style.display = 'none';
    };

    window.del = (k) => { if(confirm("حذف؟")) remove(ref(db, 'apps/'+k)); };
    
    window.filterApps = () => {
        const q = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.app-item').forEach(i => {
            i.style.display = i.getAttribute('data-name').includes(q) ? 'flex' : 'none';
        });
    };

    function msg(t) {
        const x = document.getElementById("toast");
        x.innerText = t; x.className = "show";
        setTimeout(() => x.className = "", 3000);
    }
</script>
</body>
</html>
