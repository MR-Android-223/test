<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Super | التحكم الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        /* نفس الستايل السابق مع إضافات بسيطة */
        :root { --bg-body: #0f172a; --primary: #3b82f6; --text-main: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); font-family: 'Cairo', sans-serif; padding-bottom: 100px; }
        
        /* عناصر واجهة الادمن */
        header { position: sticky; top: 0; z-index: 1000; background: #0f172a; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: #1e293b; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .card img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; margin-bottom: 5px; }
        
        /* الأزرار العائمة */
        .fab-btn { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; border: none; z-index: 2000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; }
        
        /* المودال */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1e293b; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto; border: 1px solid #334155; }
        
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #334155; border: none; color: white; border-radius: 8px; font-family: 'Cairo'; }
        .btn-full { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; font-family: 'Cairo'; }
        .btn-confirm { background: var(--primary); color: white; }
        .btn-cancel { background: transparent; border: 1px solid #475569; color: #94a3b8; }
        
        /* قائمة الإعدادات */
        .settings-menu-btn { background: #334155; padding: 15px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .settings-section { display: none; }
        
        /* تاب بار */
        .tabs-container { display: flex; gap: 5px; overflow-x: auto; padding: 10px; }
        .tab-btn { background: #1e293b; color: #94a3b8; padding: 8px 15px; border-radius: 20px; border: 1px solid #334155; white-space: nowrap; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* ستايل خاص لقسم UI */
        .ui-group { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .ui-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:900;">Admin<span style="color:#3b82f6">UI</span></div>
        <div style="display:flex; gap:10px;">
             <button onclick="openSettingsModal()" style="background:transparent; border:none; color:white; font-size:1.2rem;"><i class="fas fa-cog"></i></button>
             <button onclick="login()" id="loginBtn" style="background:#ea4335; border:none; padding:5px 10px; border-radius:5px; color:white;">Login</button>
        </div>
    </header>

    <div class="tabs-container" id="tabsList"></div>
    <div class="grid" id="appsContainer"></div>

    <button class="fab-btn" onclick="openEditModal()">+</button>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size:1.2rem; font-weight:bold; margin-bottom:20px;">⚙️ مركز التحكم</div>
            
            <div id="settingsMain">
                <div class="settings-menu-btn" onclick="openSection('uiEdit')">
                    <span>🎨 المظهر والنصوص (جديد)</span> <i class="fas fa-chevron-left"></i>
                </div>
                <div class="settings-menu-btn" onclick="openSection('sidebarEdit')">
                    <span>👤 الملف الشخصي والروابط</span> <i class="fas fa-chevron-left"></i>
                </div>
                <div class="settings-menu-btn" onclick="openSection('catManage')">
                    <span>📁 إدارة الأقسام</span> <i class="fas fa-chevron-left"></i>
                </div>
                <button onclick="closeModal('settingsModal')" class="btn-full btn-cancel">إغلاق</button>
            </div>

            <div id="uiEditSection" class="settings-section">
                <div class="ui-group">
                    <label class="ui-label">اسم المتجر (في الأعلى)</label>
                    <input type="text" id="uiStoreName" placeholder="مثال: متجر محمد">
                    <label class="ui-label">العنوان الرئيسي (Hero Title)</label>
                    <input type="text" id="uiHeroTitle" placeholder="عنوان ضخم في الوسط">
                    <label class="ui-label">الوصف الفرعي</label>
                    <input type="text" id="uiHeroDesc" placeholder="نص وصفي صغير">
                </div>

                <div class="ui-group">
                    <label class="ui-label">طريقة عرض التطبيقات</label>
                    <select id="uiViewMode">
                        <option value="grid">شبكة (مربعات بجانب بعض)</option>
                        <option value="list">قائمة (بطاقات عريضة)</option>
                    </select>
                </div>

                <div class="ui-group">
                    <label class="ui-label">اللون الأساسي للمتجر</label>
                    <input type="color" id="uiPrimaryColor" value="#3b82f6" style="height:40px; cursor:pointer;">
                </div>

                <div class="ui-group">
                    <label class="ui-label" style="display:flex; justify-content:space-between;">
                        <span>📢 شريط تنبيهات (إعلان)</span>
                        <input type="checkbox" id="uiShowAnnounce" style="width:20px; height:20px; margin:0;">
                    </label>
                    <input type="text" id="uiAnnounceText" placeholder="اكتب نص الإعلان هنا...">
                    <label class="ui-label">لون خلفية الشريط</label>
                    <input type="color" id="uiAnnounceColor" value="#f59e0b" style="height:40px;">
                </div>

                <button onclick="saveUiSettings()" id="saveUiBtn" class="btn-full btn-confirm">حفظ وتطبيق التغييرات</button>
                <button onclick="backToMain()" class="btn-full btn-cancel">رجوع</button>
            </div>

            <div id="sidebarEditSection" class="settings-section">
                <label>رابط الصورة الشخصية</label>
                <input type="text" id="profileImgUrl">
                <label>الوصف (Bio)</label>
                <input type="text" id="profileBio">
                <div style="border-top:1px solid #334155; margin:10px 0;"></div>
                <div id="linksList"></div>
                <button onclick="addLinkField()" class="btn-full" style="background:#334155;">+ رابط جديد</button>
                <button onclick="saveSidebar()" class="btn-full btn-confirm">حفظ البيانات</button>
                <button onclick="backToMain()" class="btn-full btn-cancel">رجوع</button>
            </div>
            
            <div id="catManageSection" class="settings-section">
                <div id="catListAdmin"></div>
                <input type="text" id="newCatName" placeholder="اسم القسم الجديد">
                <input type="text" id="newCatCode" placeholder="كود القسم (EN)">
                <button onclick="addNewCategory()" class="btn-full btn-confirm">إضافة قسم</button>
                <button onclick="backToMain()" class="btn-full btn-cancel">رجوع</button>
            </div>

        </div>
    </div>

    <div id="appModal" class="modal-overlay">
        <div class="modal-box">
            <h3>تطبيق</h3>
            <select id="appType"></select>
            <input type="text" id="appName" placeholder="الاسم">
            <input type="text" id="appLink" placeholder="الرابط">
            <input type="text" id="appImg" placeholder="رابط الصورة">
            <div style="display:flex; gap:10px;">
                <button onclick="saveApp()" class="btn-full btn-confirm">حفظ</button>
                <button onclick="deleteApp()" id="delAppBtn" class="btn-full" style="background:#ef4444; display:none;">حذف</button>
            </div>
            <button onclick="closeModal('appModal')" class="btn-full btn-cancel">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, update, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
            authDomain: "mohammadalboushi-e9231.firebaseapp.com",
            projectId: "mohammadalboushi-e9231",
            databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
            appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();
        
        // متغيرات عامة
        let fullSettings = {}; 
        let currentEditKey = null;
        let allApps = {};
        let allCats = {};

        // تسجيل الدخول
        window.login = () => signInWithPopup(auth, provider);
        onAuthStateChanged(auth, user => {
            if(user && user.uid === "eBOYmcmDI5S6l4NQd36bEa5kEcZ2") {
                document.getElementById('loginBtn').style.display = 'none';
                initAdmin();
            }
        });

        function initAdmin() {
            // جلب الإعدادات كاملة
            onValue(ref(db, 'settings'), (snap) => {
                fullSettings = snap.val() || {};
                fillUiInputs();
                fillSidebarInputs();
            });

            onValue(ref(db, 'apps'), (snap) => { allApps = snap.val() || {}; renderApps(); });
            onValue(ref(db, 'categories'), (snap) => { allCats = snap.val() || {}; renderCats(); });
        }

        // --- دوال UI Control (الجزء الجديد) ---
        function fillUiInputs() {
            const ui = fullSettings.ui || {};
            document.getElementById('uiStoreName').value = ui.storeName || "M.Al.Boushi";
            document.getElementById('uiHeroTitle').value = ui.heroTitle || "متجر التطبيقات";
            document.getElementById('uiHeroDesc').value = ui.heroDesc || "كل ما تحتاجه في مكان واحد";
            document.getElementById('uiViewMode').value = ui.viewMode || "grid";
            document.getElementById('uiPrimaryColor').value = ui.primaryColor || "#3b82f6";
            document.getElementById('uiShowAnnounce').checked = ui.showAnnouncement || false;
            document.getElementById('uiAnnounceText').value = ui.announcementText || "";
            document.getElementById('uiAnnounceColor').value = ui.announcementColor || "#f59e0b";
        }

        window.saveUiSettings = () => {
            const newUi = {
                storeName: document.getElementById('uiStoreName').value,
                heroTitle: document.getElementById('uiHeroTitle').value,
                heroDesc: document.getElementById('uiHeroDesc').value,
                viewMode: document.getElementById('uiViewMode').value,
                primaryColor: document.getElementById('uiPrimaryColor').value,
                showAnnouncement: document.getElementById('uiShowAnnounce').checked,
                announcementText: document.getElementById('uiAnnounceText').value,
                announcementColor: document.getElementById('uiAnnounceColor').value
            };
            
            update(ref(db, 'settings/ui'), newUi)
                .then(() => alert("تم تحديث مظهر المتجر بنجاح! 🎨"))
                .catch(e => alert("خطأ: " + e.message));
        };

        // --- باقي دوال الأدمن (تم تحديثها لتتوافق مع الهيكل الجديد) ---
        
        window.openSettingsModal = () => { document.getElementById('settingsModal').style.display = 'flex'; backToMain(); };
        window.backToMain = () => {
            document.querySelectorAll('.settings-section').forEach(d => d.style.display = 'none');
            document.getElementById('settingsMain').style.display = 'block';
        };
        window.openSection = (id) => {
            document.getElementById('settingsMain').style.display = 'none';
            if(id === 'uiEdit') document.getElementById('uiEditSection').style.display = 'block';
            if(id === 'sidebarEdit') document.getElementById('sidebarEditSection').style.display = 'block';
            if(id === 'catManage') { document.getElementById('catManageSection').style.display = 'block'; renderCatListAdmin(); }
        };

        // Sidebar Saving Logic
        function fillSidebarInputs() {
            document.getElementById('profileImgUrl').value = fullSettings.profileImg || "";
            document.getElementById('profileBio').value = fullSettings.bio || "";
            // Links rendering omitted for brevity, logic remains similar to previous version
        }
        window.saveSidebar = () => {
            const data = {
                profileImg: document.getElementById('profileImgUrl').value,
                bio: document.getElementById('profileBio').value,
                // links would be gathered here
            };
            update(ref(db, 'settings'), data).then(() => alert("تم حفظ البروفايل"));
        };

        // Apps Logic
        function renderApps() {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';
            Object.entries(allApps).forEach(([k, v]) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<img src="${v.img}"><div>${v.name}</div>`;
                div.onclick = () => openEditModal(k, v);
                container.appendChild(div);
            });
        }

        window.openEditModal = (k, v) => {
            document.getElementById('appModal').style.display = 'flex';
            const sel = document.getElementById('appType');
            sel.innerHTML = '';
            Object.entries(allCats).forEach(([ck, cv]) => sel.innerHTML += `<option value="${ck}">${cv.name}</option>`);
            
            if(k) {
                currentEditKey = k;
                document.getElementById('appName').value = v.name;
                document.getElementById('appLink').value = v.link;
                document.getElementById('appImg').value = v.img;
                document.getElementById('appType').value = v.type;
                document.getElementById('delAppBtn').style.display = 'block';
            } else {
                currentEditKey = null;
                document.getElementById('appName').value = '';
                document.getElementById('appLink').value = '';
                document.getElementById('appImg').value = '';
                document.getElementById('delAppBtn').style.display = 'none';
            }
        };

        window.saveApp = () => {
            const data = {
                name: document.getElementById('appName').value,
                link: document.getElementById('appLink').value,
                img: document.getElementById('appImg').value,
                type: document.getElementById('appType').value,
                isHidden: false,
                order: 0
            };
            if(currentEditKey) update(ref(db, `apps/${currentEditKey}`), data);
            else push(ref(db, 'apps'), data);
            closeModal('appModal');
        };

        window.deleteApp = () => {
            if(confirm("حذف؟")) {
                remove(ref(db, `apps/${currentEditKey}`));
                closeModal('appModal');
            }
        };

        // Helper
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
    </script>
</body>
</html>
