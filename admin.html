<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel V10 | Ultimate Fix</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg-body: #0f172a; 
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
            --card-glass: rgba(30, 41, 59, 0.95); 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8;
            --primary: #3b82f6; 
            --danger: #ef4444; 
            --success: #10b981;
            --warning: #f59e0b;
            --border: rgba(255,255,255,0.08);
            --grid-cols: 2;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-body); 
            background-image: var(--bg-gradient); 
            color: var(--text-main); 
            font-family: 'Cairo', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 100px; 
            overflow-y: auto;
        }

        /* Header */
        header {
            position: sticky; top: 0; z-index: 1000; 
            background: rgba(15, 23, 42, 0.98);
            border-bottom: 1px solid var(--border); 
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; 
            backdrop-filter: blur(10px);
        }
        .header-btn {
            background: rgba(255,255,255,0.05); color: white; 
            border: 1px solid var(--border);
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer;
        }

        /* Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(var(--grid-cols), 1fr); 
            gap: 15px; 
            padding: 15px 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        
        .card {
            background: var(--card-glass); 
            border-radius: 18px; 
            padding: 15px; 
            border: 1px solid var(--border);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            height: 100%;
        }
        
        .card img { 
            width: 65px; height: 65px; 
            border-radius: 16px; 
            margin-bottom: 12px; 
            object-fit: cover; 
            background: #1e293b; 
        }
        
        .card-title { 
            font-size: 0.85rem; font-weight: 700; text-align: center; 
            line-height: 1.4; color: #e2e8f0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
            overflow: hidden; width: 100%;
        }

        /* زر الخيارات (ثلاث نقاط) */
        .card-options-btn {
            position: absolute; top: 10px; right: 10px;
            color: #94a3b8; padding: 5px; cursor: pointer;
            z-index: 10; font-size: 1rem;
        }
        
        /* القائمة المنسدلة داخل الكرت */
        .card-dropdown {
            display: none; position: absolute; top: 35px; right: 10px;
            background: #1e293b; border: 1px solid var(--border);
            border-radius: 12px; width: 140px; z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;
        }
        .card-dropdown.show { display: block; animation: fadeIn 0.2s; }
        
        .dropdown-item {
            padding: 10px 15px; font-size: 0.85rem; color: #cbd5e1;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); }
        .dropdown-item.danger { color: #ef4444; }

        /* Tabs */
        .tabs-wrapper { position: sticky; top: 72px; z-index: 900; padding: 10px 0; background: #0f172a; }
        .tabs-container { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; }
        .tab-btn {
            background: #1e293b; color: #94a3b8; border: 1px solid var(--border);
            padding: 8px 18px; border-radius: 12px; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* FAB */
        .fab-btn {
            position: fixed; bottom: 30px; left: 30px; width: 55px; height: 55px;
            background: var(--primary); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            cursor: pointer; z-index: 2000; border: none;
        }

        /* Modals */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 3000; 
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-box { 
            background: #1e293b; padding: 25px; border-radius: 20px; 
            width: 90%; max-width: 380px; border: 1px solid var(--border); 
            text-align: center; max-height: 85vh; overflow-y: auto;
        }
        .btn-full { 
            width: 100%; padding: 12px; border-radius: 12px; border: none; 
            font-weight: bold; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: center; gap: 8px;
        }
        .btn-confirm { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-cancel { background: #334155; color: white; }
        
        input, select { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; 
            border: 1px solid #334155; outline: none; background: #0f172a; color: white; 
            text-align: center; font-family: inherit;
        }

        /* Settings List */
        .cat-manage-item {
            background: #0f172a; padding: 12px; margin-bottom: 8px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #334155;
        }
        
        /* Search Result */
        .search-result-item { 
            display: flex; align-items: center; gap: 12px; padding: 10px; 
            background: #334155; margin-bottom: 8px; border-radius: 12px; 
            cursor: pointer; text-align: right; 
        }

        @keyframes fadeIn { from{opacity:0; transform:translateY(-5px);} to{opacity:1; transform:translateY(0);} }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:900;">Admin<span style="color:var(--primary)">Panel</span></div>
        <div style="display:flex; gap:8px;">
            <div class="header-btn" onclick="toggleLayout()"><i class="fas fa-columns"></i></div>
            <div class="header-btn" onclick="openSettingsModal()"><i class="fas fa-cog"></i></div>
            <button onclick="login()" id="loginBtn" class="header-btn" style="background:#ea4335; width:auto; padding:0 15px; display:none; font-size:0.9rem;">دخول</button>
        </div>
    </header>

    <div class="tabs-wrapper">
        <div class="tabs-container" id="tabsList"></div>
    </div>

    <div class="grid" id="appsContainer"></div>

    <button class="fab-btn" onclick="openAddChoiceModal()">+</button>


    <div id="addChoiceModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:white; margin-bottom:20px;">إضافة تطبيق</h3>
            <button onclick="openStoreSearch()" class="btn-full" style="background:#10b981; color:white;">
                <i class="fab fa-google-play"></i> بحث في المتجر
            </button>
            <button onclick="openEditModal()" class="btn-full" style="background:#3b82f6; color:white;">
                <i class="fas fa-pen"></i> إضافة يدوية
            </button>
            <button onclick="closeModal('addChoiceModal')" class="btn-full btn-cancel">إلغاء</button>
        </div>
    </div>

    <div id="storeSearchModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:white; margin-bottom:15px;">بحث في المتجر</h3>
            <div style="position:relative;">
                <input type="text" id="storeSearchInput" placeholder="اكتب اسم اللعبة أو التطبيق...">
                <i class="fas fa-search" onclick="searchStore()" style="position:absolute; left:15px; top:15px; color:var(--primary);"></i>
            </div>
            <div id="storeSearchResults" style="max-height:300px; overflow-y:auto; margin-top:10px;"></div>
            <button onclick="closeModal('storeSearchModal')" class="btn-full btn-cancel" style="margin-top:10px;">إغلاق</button>
        </div>
    </div>

    <div id="appModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:white; margin-bottom:15px;">بيانات التطبيق</h3>
            <select id="appCat"></select>
            <input type="text" id="appName" placeholder="الاسم">
            <input type="text" id="appImgUrl" placeholder="رابط الصورة" style="direction:ltr;">
            <input type="text" id="appLink" placeholder="رابط التحميل" style="direction:ltr;">
            <button onclick="saveApp()" class="btn-full btn-confirm">حفظ</button>
            <button onclick="closeModal('appModal')" class="btn-full btn-cancel">إغلاق</button>
        </div>
    </div>

    <div id="moveAppModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:white; margin-bottom:15px;">نقل التطبيق</h3>
            <p style="color:#94a3b8; margin-bottom:10px;">اختر القسم الجديد:</p>
            <select id="moveCatSelect"></select>
            <button onclick="confirmMoveApp()" class="btn-full btn-confirm">نقل</button>
            <button onclick="closeModal('moveAppModal')" class="btn-full btn-cancel">إلغاء</button>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:white; margin-bottom:20px;">الإعدادات</h3>
            <div id="catLockList" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
            <div style="border-top:1px solid #334155; padding-top:10px;">
                <input type="text" id="newCatName" placeholder="اسم قسم جديد">
                <button onclick="addNewCategory()" class="btn-full btn-confirm">إضافة قسم</button>
            </div>
            <button onclick="closeModal('settingsModal')" class="btn-full btn-cancel" style="margin-top:10px;">إغلاق</button>
        </div>
    </div>

    <div id="alertModal" class="modal-overlay" style="z-index:4000;">
        <div class="modal-box">
            <div id="alertIcon" style="font-size:3rem; margin-bottom:10px;"></div>
            <h3 id="alertTitle" style="color:white; margin-bottom:10px;"></h3>
            <p id="alertMsg" style="color:#94a3b8; margin-bottom:20px;"></p>
            <button onclick="closeModal('alertModal')" class="btn-full btn-confirm">حسناً</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
            authDomain: "mohammadalboushi-e9231.firebaseapp.com",
            projectId: "mohammadalboushi-e9231",
            databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
            appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2";

        let allApps = {};
        let allCats = {};
        let currentFilter = 'ALL';
        let editKey = null;
        let moveKey = null; // Key of app to move
        let gridCols = 2;

        onAuthStateChanged(auth, (user) => {
            if (user && user.uid === myUID) {
                document.getElementById('loginBtn').style.display = 'none';
                initData();
            } else {
                document.getElementById('loginBtn').style.display = 'flex';
                document.getElementById('appsContainer').innerHTML = "<div style='grid-column:span 2; text-align:center; color:white;'>يرجى تسجيل الدخول</div>";
            }
        });

        window.login = () => signInWithPopup(auth, new GoogleAuthProvider());

        function initData() {
            onValue(ref(db, 'categories'), (s) => {
                const val = s.val();
                if(!val) update(ref(db, 'categories'), {'PROGRAM': {name:'تطبيقات', order:1}});
                else { allCats = val; renderTabs(); if(document.getElementById('settingsModal').style.display=='flex') renderCatLockList(); }
            });
            
            onValue(ref(db, 'apps'), (s) => {
                allApps = s.val() || {};
                renderApps();
            });
        }

        // ============ RENDER APPS (With Menu) ============
        function renderApps() {
            const container = document.getElementById('appsContainer');
            let sorted = Object.entries(allApps);
            
            if(currentFilter !== 'ALL') sorted = sorted.filter(([,v]) => v.type === currentFilter);
            sorted.sort(([,a], [,b]) => (b.lastModified || 0) - (a.lastModified || 0));

            let html = '';
            if(sorted.length === 0) html = `<div style="grid-column:span 2; text-align:center; color:#64748b; padding:40px;">فارغ</div>`;
            
            sorted.forEach(([k, v]) => {
                const opacity = v.isHidden ? '0.5' : '1';
                const lockIcon = v.isHidden ? '<i class="fas fa-eye-slash" style="color:#f59e0b; margin-left:5px;"></i>' : '';
                
                html += `
                    <div class="card" style="opacity:${opacity}">
                        <div class="card-options-btn" onclick="toggleCardMenu(event, '${k}')">
                            <i class="fas fa-ellipsis-v"></i>
                        </div>
                        
                        <div id="menu-${k}" class="card-dropdown">
                            <div class="dropdown-item" onclick="openEditModal('${k}')">
                                <i class="fas fa-pen" style="color:#3b82f6;"></i> تعديل
                            </div>
                            <div class="dropdown-item" onclick="toggleHideApp('${k}')">
                                <i class="fas ${v.isHidden ? 'fa-eye' : 'fa-eye-slash'}" style="color:#f59e0b;"></i> ${v.isHidden ? 'إظهار' : 'إخفاء'}
                            </div>
                            <div class="dropdown-item" onclick="openMoveModal('${k}')">
                                <i class="fas fa-exchange-alt" style="color:#10b981;"></i> نقل
                            </div>
                            <div class="dropdown-item danger" onclick="deleteApp('${k}')">
                                <i class="fas fa-trash"></i> حذف
                            </div>
                        </div>

                        <img src="${v.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/564/564619.png'">
                        <div class="card-title">${lockIcon} ${v.name}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ============ MENUS & ACTIONS ============
        
        // إظهار/إخفاء قائمة الكرت
        window.toggleCardMenu = (e, key) => {
            e.stopPropagation();
            // أغلق أي قائمة مفتوحة أولاً
            document.querySelectorAll('.card-dropdown').forEach(el => el.classList.remove('show'));
            // افتح القائمة المطلوبة
            const menu = document.getElementById(`menu-${key}`);
            if(menu) menu.classList.add('show');
        };

        // إغلاق القوائم عند النقر في أي مكان
        document.addEventListener('click', () => {
            document.querySelectorAll('.card-dropdown').forEach(el => el.classList.remove('show'));
        });

        // إخفاء/إظهار التطبيق
        window.toggleHideApp = (key) => {
            const current = allApps[key].isHidden || false;
            update(ref(db, `apps/${key}`), { isHidden: !current });
        };

        // حذف التطبيق
        window.deleteApp = (key) => {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                remove(ref(db, `apps/${key}`));
            }
        };

        // نقل التطبيق - فتح المودال
        window.openMoveModal = (key) => {
            moveKey = key;
            const select = document.getElementById('moveCatSelect');
            let opts = '';
            Object.entries(allCats).forEach(([k, v]) => {
                opts += `<option value="${k}">${v.name}</option>`;
            });
            select.innerHTML = opts;
            document.getElementById('moveAppModal').style.display = 'flex';
        };

        // تنفيذ النقل
        window.confirmMoveApp = () => {
            if(!moveKey) return;
            const newCat = document.getElementById('moveCatSelect').value;
            update(ref(db, `apps/${moveKey}`), { type: newCat });
            closeModal('moveAppModal');
        };

        // ============ CATEGORIES & LOCK FIX ============
        
        window.renderCatLockList = () => {
            const list = document.getElementById('catLockList');
            list.innerHTML = '';
            
            Object.entries(allCats).forEach(([k, v]) => {
                // منطق الأيقونة واللون
                const isLocked = v.isHidden === true;
                const iconClass = isLocked ? 'fa-lock' : 'fa-lock-open';
                const color = isLocked ? '#ef4444' : '#10b981'; // أحمر للمقفل، أخضر للمفتوح

                const div = document.createElement('div');
                div.className = 'cat-manage-item';
                div.innerHTML = `
                    <span>${v.name}</span>
                    <div style="display:flex; gap:15px; align-items:center;">
                        <i class="fas fa-trash" style="color:#94a3b8; cursor:pointer;" onclick="deleteCat('${k}')"></i>
                        <i class="fas ${iconClass}" style="color:${color}; cursor:pointer; font-size:1.2rem;" onclick="toggleCatLock('${k}')"></i>
                    </div>
                `;
                list.appendChild(div);
            });
        };

        // إصلاح القفل: القراءة مباشرة من الداتا بيس
        window.toggleCatLock = (key) => {
            const currentStatus = allCats[key].isHidden || false;
            update(ref(db, `categories/${key}`), { isHidden: !currentStatus });
            // الـ listener رح يعيد رسم القائمة تلقائياً
        };

        window.addNewCategory = () => {
            const n = document.getElementById('newCatName').value;
            if(n) update(ref(db, `categories/CAT_${Date.now()}`), {name:n, order:99});
            document.getElementById('newCatName').value = '';
        };

        window.deleteCat = (k) => {
            if(confirm("حذف القسم؟")) remove(ref(db, `categories/${k}`));
        };

        // ============ SEARCH FIX (Important) ============
        window.searchStore = async () => {
            const q = document.getElementById('storeSearchInput').value;
            const resDiv = document.getElementById('storeSearchResults');
            resDiv.innerHTML = '<div style="text-align:center; color:white;">جاري البحث...</div>';

            try {
                // نستخدم iTunes API للبيانات فقط
                const url = `https://corsproxy.io/?` + encodeURIComponent(`https://itunes.apple.com/search?term=${q}&entity=software&limit=10&country=SA`);
                const req = await fetch(url);
                const data = await req.json();

                resDiv.innerHTML = '';
                data.results.forEach(app => {
                    // الحل الجذري للرابط: استخدام رابط البحث في جوجل بلاي بدلاً من المعرف المباشر
                    // هذا يضمن أن الرابط يعمل دائماً ويفتح التطبيق في المتجر
                    const safePlayLink = `https://play.google.com/store/search?q=${encodeURIComponent(app.trackName)}&c=apps`;

                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.onclick = () => {
                        closeModal('storeSearchModal');
                        openEditModal(null);
                        document.getElementById('appName').value = app.trackName;
                        document.getElementById('appImgUrl').value = app.artworkUrl100; // صورة أفضل
                        document.getElementById('appLink').value = safePlayLink; // الرابط الآمن
                    };
                    item.innerHTML = `
                        <img src="${app.artworkUrl60}" style="border-radius:10px;">
                        <div style="flex-grow:1; color:white;">
                            <div style="font-weight:bold;">${app.trackName}</div>
                            <div style="font-size:0.8rem; color:#94a3b8;">${app.artistName}</div>
                        </div>
                        <i class="fas fa-plus-circle" style="color:#10b981; font-size:1.5rem;"></i>
                    `;
                    resDiv.appendChild(item);
                });
            } catch(e) {
                resDiv.innerHTML = '<div style="color:red; text-align:center;">خطأ في الاتصال</div>';
            }
        };

        // ============ Helpers ============
        window.openEditModal = (key) => {
            closeModal('addChoiceModal');
            document.getElementById('appModal').style.display = 'flex';
            const catSelect = document.getElementById('appCat');
            
            let opts = '';
            Object.entries(allCats).forEach(([k,v]) => opts += `<option value="${k}">${v.name}</option>`);
            catSelect.innerHTML = opts;

            if(key) {
                editKey = key;
                const d = allApps[key];
                document.getElementById('appName').value = d.name;
                document.getElementById('appImgUrl').value = d.img;
                document.getElementById('appLink').value = d.link;
                catSelect.value = d.type;
            } else {
                editKey = null;
                document.getElementById('appName').value = '';
                document.getElementById('appImgUrl').value = '';
                document.getElementById('appLink').value = '';
            }
        };

        window.saveApp = () => {
            const d = {
                name: document.getElementById('appName').value,
                img: document.getElementById('appImgUrl').value,
                link: document.getElementById('appLink').value,
                type: document.getElementById('appCat').value,
                lastModified: Date.now()
            };
            if(!d.name) return;
            
            if(editKey) update(ref(db, `apps/${editKey}`), d);
            else push(ref(db, 'apps'), d);
            
            closeModal('appModal');
        };

        window.renderTabs = () => {
            const c = document.getElementById('tabsList');
            let h = `<button class="tab-btn ${currentFilter=='ALL'?'active':''}" onclick="currentFilter='ALL';renderApps();renderTabs()">الكل</button>`;
            Object.entries(allCats).forEach(([k,v]) => {
                h += `<button class="tab-btn ${currentFilter==k?'active':''}" onclick="currentFilter='${k}';renderApps();renderTabs()">${v.name}</button>`;
            });
            c.innerHTML = h;
        };

        window.openSettingsModal = () => { document.getElementById('settingsModal').style.display='flex'; renderCatLockList(); };
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.openAddChoiceModal = () => document.getElementById('addChoiceModal').style.display = 'flex';
        window.openStoreSearch = () => { closeModal('addChoiceModal'); document.getElementById('storeSearchModal').style.display='flex'; };
        window.toggleLayout = () => { gridCols = gridCols===2?1:2; document.documentElement.style.setProperty('--grid-cols', gridCols); };

    </script>
</body>
</html>
