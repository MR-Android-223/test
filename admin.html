<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم V12 | الأقسام</title>
    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); text-align: center; margin: 0; padding: 20px; }
        .box { background: var(--card); padding: 30px; border-radius: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: none; outline: none; font-size: 1rem; box-sizing: border-box; }
        input, select { background: #334155; color: white; border: 1px solid transparent; }
        input:focus { border-color: var(--primary); }
        .main-btn { background: linear-gradient(45deg, #2563eb, #3b82f6); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        .upload-area { border: 2px dashed #334155; padding: 20px; border-radius: 12px; margin: 10px 0; cursor: pointer; }
        #previewImg { width: 100px; height: 100px; border-radius: 15px; object-fit: cover; display: none; margin: 10px auto; border: 2px solid var(--primary); }
        
        .section-title { text-align: right; color: #94a3b8; font-size: 0.9rem; margin-top: 20px; }
        .app-item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; margin-top: 10px; border-radius: 12px; transition:0.3s; }
        .btn-group { display: flex; gap: 8px; }
        .sm-btn { width: auto; padding: 8px 15px; margin: 0; font-size: 0.8rem; cursor: pointer; }
        
        #toast { visibility: hidden; min-width: 200px; background: #10b981; color: white; padding: 15px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); border-radius: 50px; z-index: 2000; }
        #toast.show { visibility: visible; animation: fade 0.5s; }
        @keyframes fade { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    </style>
</head>
<body>

<div id="toast">✅ تم بنجاح</div>

<div class="box">
    <div id="loginArea">
        <h2>🔐 دخول المدير</h2>
        <button onclick="login()" style="background:#ea4335; color:white;">تسجيل الدخول عبر Google</button>
    </div>

    <div id="adminArea" style="display:none;">
        <h3 id="formTitle">✨ إضافة جديد</h3>
        
        <label style="display:block; text-align:right; font-size:0.8rem; color:#94a3b8;">اختر القسم (المجلد):</label>
        <select id="appType" onchange="filterMyApps()">
            <option value="PROGRAM">📱 تطبيقات (Programs)</option>
            <option value="GAME">🎮 ألعاب (Games)</option>
            <option value="WEBSITE">🌐 مواقع (Websites)</option>
            <option value="FILE">📁 ملفات (Files)</option>
        </select>

        <input type="text" id="appName" placeholder="الاسم (مثلاً: موقعي)">
        <input type="text" id="appLink" placeholder="الرابط">
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span id="uploadLabel">📸 صورة (اختياري)</span>
            <input type="file" id="fileInput" hidden accept="image/*" onchange="processImage()">
            <img id="previewImg">
        </div>

        <button id="saveBtn" class="main-btn" onclick="handleProcess()">🚀 نشر في هذا القسم</button>
        <button id="cancelBtn" style="display:none; background:#475569; color:white;" onclick="resetForm()">إلغاء</button>

        <hr style="border-color:#334155; margin:30px 0;">
        
        <h4 class="section-title" id="listTitle">📂 محتويات قسم: تطبيقات</h4>
        <div id="appsList">جاري التحميل...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
        authDomain: "mohammadalboushi-e9231.firebaseapp.com",
        projectId: "mohammadalboushi-e9231",
        databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
        appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();
    const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2";

    let editKey = null;
    let currentImgBase64 = "";
    let allDataCache = {}; // تخزين كل البيانات هنا

    onAuthStateChanged(auth, (user) => {
        if (user && user.uid === myUID) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('adminArea').style.display = 'block';
            loadData();
        }
    });

    window.login = () => signInWithPopup(auth, provider);

    // معالجة الصورة (Base64)
    window.processImage = () => {
        const file = document.getElementById('fileInput').files[0];
        if (file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const imgElement = document.createElement("img");
                imgElement.src = event.target.result;
                imgElement.onload = function (e) {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 200;
                    const scaleSize = MAX_WIDTH / e.target.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = e.target.height * scaleSize;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(e.target, 0, 0, canvas.width, canvas.height);
                    currentImgBase64 = canvas.toDataURL("image/jpeg", 0.7);
                    document.getElementById('previewImg').src = currentImgBase64;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('uploadLabel').innerText = "تم ✅";
                }
            }
        }
    };

    // النشر أو التعديل
    window.handleProcess = async () => {
        const name = document.getElementById('appName').value;
        const link = document.getElementById('appLink').value;
        const type = document.getElementById('appType').value;
        const btn = document.getElementById('saveBtn');

        if (!name || !link) return alert("الاسم والرابط مطلوبين");

        btn.disabled = true;
        btn.innerText = "⏳ جاري التنفيذ...";

        try {
            const finalImg = currentImgBase64 || "https://cdn-icons-png.flaticon.com/512/564/564619.png";
            const data = { name, link, img: finalImg, type };

            if (editKey) {
                await update(ref(db, 'apps/' + editKey), data);
                msg("✅ تم التعديل");
            } else {
                await push(ref(db, 'apps'), data);
                msg("🚀 تم النشر");
            }
            resetForm();
        } catch (e) { alert("خطأ: " + e.message); }
        
        btn.disabled = false;
        btn.innerText = "🚀 نشر في هذا القسم";
    };

    // تحميل البيانات وتخزينها
    function loadData() {
        onValue(ref(db, 'apps'), (s) => {
            allDataCache = s.val() || {};
            filterMyApps(); // استدعاء الفلتر لعرض البيانات حسب الاختيار الحالي
        });
    }

    // فلترة القائمة بناءً على الـ Select المختار
    window.filterMyApps = () => {
        const selectedType = document.getElementById('appType').value;
        const list = document.getElementById('appsList');
        const title = document.getElementById('listTitle');
        
        // تحديث عنوان القائمة
        let typeName = "تطبيقات";
        if(selectedType === 'GAME') typeName = "ألعاب";
        if(selectedType === 'WEBSITE') typeName = "مواقع";
        if(selectedType === 'FILE') typeName = "ملفات";
        title.innerText = "📂 محتويات قسم: " + typeName;

        list.innerHTML = "";
        
        // تحويل البيانات لمصفوفة وعرض الموافق للقسم فقط
        const entries = Object.entries(allDataCache).reverse();
        let found = false;

        entries.forEach(([k, v]) => {
            // الشرط السحري: اعرض فقط إذا كان النوع مطابق للاختيار
            if (v.type === selectedType) {
                found = true;
                const div = document.createElement('div');
                div.className = 'app-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${v.img}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;">
                        <div style="text-align:right">
                            <strong>${v.name}</strong>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="sm-btn" style="background:#f59e0b; color:white;" onclick="startEdit('${k}','${v.name}','${v.link}','${v.img}','${v.type}')">✏️</button>
                        <button class="sm-btn" style="background:#ef4444; color:white;" onclick="del('${k}')">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            }
        });

        if (!found) {
            list.innerHTML = `<p style="color:#64748b; font-size:0.9rem;">المجلد فارغ حالياً</p>`;
        }
    };

    window.startEdit = (k, n, l, i, t) => {
        editKey = k; currentImgBase64 = i;
        document.getElementById('appName').value = n;
        document.getElementById('appLink').value = l;
        document.getElementById('appType').value = t; // سيقوم بتغيير القائمة تلقائياً
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('previewImg').src = i;
        document.getElementById('formTitle').innerText = "✏️ تعديل";
        document.getElementById('saveBtn').innerText = "حفظ التعديلات";
        document.getElementById('cancelBtn').style.display = 'inline-block';
        
        filterMyApps(); // تحديث القائمة لتطابق عنصر التعديل
        window.scrollTo(0,0);
    };

    window.resetForm = () => {
        editKey = null; currentImgBase64 = "";
        document.getElementById('appName').value = '';
        document.getElementById('appLink').value = '';
        document.getElementById('previewImg').style.display = 'none';
        document.getElementById('formTitle').innerText = "✨ إضافة جديد";
        document.getElementById('saveBtn').innerText = "🚀 نشر في هذا القسم";
        document.getElementById('cancelBtn').style.display = 'none';
    };

    window.del = (k) => { if(confirm("حذف؟")) remove(ref(db, 'apps/'+k)); };
    function msg(t) { const x = document.getElementById("toast"); x.innerText = t; x.className = "show"; setTimeout(() => x.className = "", 3000); }
</script>
</body>
</html>
