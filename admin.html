<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel V9.0 | Fixed Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg-body: #0f172a; 
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
            --card-glass: rgba(30, 41, 59, 0.95); 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8;
            --primary: #3b82f6; 
            --danger: #ef4444; 
            --success: #10b981;
            --warning: #f59e0b;
            --border: rgba(255,255,255,0.08);
            --grid-cols: 2;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-body); 
            background-image: var(--bg-gradient); 
            color: var(--text-main); 
            font-family: 'Cairo', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 100px; 
            overflow-y: auto;
            touch-action: pan-y; 
        }

        /* --- Header --- */
        header {
            position: sticky; top: 0; z-index: 1000; 
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border); 
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; 
            backdrop-filter: blur(10px);
        }
        .logo-area { font-weight: 900; font-size: 1.2rem; display: flex; align-items: center; gap: 5px; }
        .logo-area i { color: var(--primary); }

        .header-btn {
            background: rgba(255,255,255,0.05); color: white; 
            border: 1px solid var(--border);
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .header-btn:active { transform: scale(0.95); background: var(--primary); }

        /* --- Grid System --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(var(--grid-cols), 1fr); 
            gap: 15px; 
            padding: 15px 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        
        .card {
            background: var(--card-glass); 
            border-radius: 18px; 
            padding: 15px; 
            border: 1px solid var(--border);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            position: relative; 
            transition: transform 0.2s, background 0.2s; 
            height: 100%;
            user-select: none;
        }
        .card:active { transform: scale(0.98); background: #334155; }
        
        /* تحسين مظهر الأيقونة */
        .card img { 
            width: 65px; height: 65px; 
            border-radius: 16px; 
            margin-bottom: 12px; 
            object-fit: cover; 
            pointer-events: none; 
            background: #1e293b; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .card-title { 
            font-size: 0.85rem; font-weight: 700; text-align: center; 
            line-height: 1.4; color: #e2e8f0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
            overflow: hidden; width: 100%;
        }
        
        /* مقبض السحب */
        .drag-handle { 
            position: absolute; top: 5px; right: 5px; 
            color: rgba(255,255,255,0.3); 
            padding: 8px; z-index: 10; font-size: 1rem; 
            cursor: grab; 
        }
        
        /* شارة التعديل */
        .edit-badge {
            position: absolute; top: 8px; left: 8px; 
            background: rgba(16, 185, 129, 0.2); 
            color: #10b981; 
            padding: 4px 8px; border-radius: 8px; 
            font-size: 0.7rem; font-weight: bold;
        }

        /* --- Tabs --- */
        .tabs-wrapper { 
            position: sticky; top: 72px; z-index: 900; 
            padding: 5px 0 15px 0; 
            background: linear-gradient(to bottom, #0f172a 80%, rgba(15,23,42,0) 100%);
        }
        .tabs-container { 
            display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; 
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: #1e293b; color: #94a3b8; border: 1px solid var(--border);
            padding: 10px 22px; border-radius: 12px; cursor: pointer; 
            font-family: inherit; font-weight: 700; font-size: 0.9rem; 
            white-space: nowrap; flex-shrink: 0; transition: 0.3s;
        }
        .tab-btn.active { 
            background: var(--primary); color: white; border-color: var(--primary); 
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* --- FAB Button --- */
        .fab-btn {
            position: fixed; bottom: 30px; left: 30px; width: 55px; height: 55px;
            background: var(--primary); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            cursor: pointer; z-index: 2000; border: none; transition: 0.2s;
        }
        .fab-btn:active { transform: scale(0.9) rotate(90deg); }

        /* --- Modals --- */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 3000; 
            align-items: center; justify-content: center; backdrop-filter: blur(5px); 
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

        .modal-box { 
            background: #1e293b; padding: 25px; border-radius: 24px; 
            width: 85%; max-width: 380px; 
            border: 1px solid var(--border); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); 
            text-align: center; max-height: 85vh; overflow-y: auto;
        }
        
        .modal-title { font-size: 1.2rem; color: white; margin-bottom: 20px; font-weight: 800; }
        
        .btn-full { 
            width: 100%; padding: 14px; border-radius: 14px; border: none; 
            font-weight: 700; font-size: 0.95rem; cursor: pointer; 
            font-family: inherit; margin-bottom: 10px; display: flex; 
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-confirm { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-cancel { background: #334155; color: white; }

        input, select { 
            width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px; 
            border: 1px solid #334155; outline: none; font-size: 0.95rem; 
            background: #0f172a; color: white; font-family: inherit; text-align: center; 
        }
        input:focus { border-color: var(--primary); }

        /* --- Settings Lists --- */
        .settings-menu-btn {
            display: flex; align-items: center; justify-content: space-between;
            background: #334155; color: white; padding: 16px; border-radius: 14px; 
            margin-bottom: 10px; cursor: pointer; border: 1px solid var(--border); font-weight: 600;
        }
        
        /* --- Category Management Items --- */
        .cat-manage-item {
            background: #0f172a; padding: 12px; margin-bottom: 8px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #334155;
        }
        .cat-actions { display: flex; gap: 12px; align-items: center; }
        .cat-actions i { font-size: 1.1rem; cursor: pointer; padding: 5px; transition: 0.2s; }
        .cat-actions i:active { transform: scale(0.8); }

        /* --- Search Results --- */
        .search-result-item { 
            display: flex; align-items: center; gap: 12px; padding: 10px; 
            background: #334155; margin-bottom: 8px; border-radius: 12px; 
            cursor: pointer; text-align: right; 
        }
        .search-result-item img { width: 45px; height: 45px; border-radius: 10px; background: #000; }

        /* --- Custom Confirm Modal --- */
        #confirmModal .modal-box { border-top: 4px solid var(--danger); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <i class="fas fa-layer-group"></i>
            <span>لوحة التحكم</span>
        </div>
        <div class="header-left" style="display:flex; gap:8px;">
            <button class="header-btn" onclick="toggleSort()">
                <i class="fas fa-sort" id="sortIcon"></i>
            </button>

            <button class="header-btn" onclick="toggleLayout()">
                <i class="fas fa-columns"></i>
            </button>

            <button onclick="openSettingsModal()" class="header-btn">
                <i class="fas fa-cog"></i>
            </button>

            <button onclick="login()" id="loginBtn" class="header-btn" style="background:#ea4335; border-color:#ea4335; width:auto; padding:0 15px; display:none;">
                دخول
            </button>
        </div>
    </header>

    <div class="tabs-wrapper">
        <div class="tabs-container" id="tabsList"></div>
    </div>

    <div class="grid" id="appsContainer">
        <div style="grid-column: span var(--grid-cols); text-align: center; color: #64748b; margin-top: 60px;">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i><br><br>جاري التحميل...
        </div>
    </div>

    <button class="fab-btn" onclick="openAddChoiceModal()">+</button>


    <div id="addChoiceModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">إضافة تطبيق جديد</div>
            <button onclick="openStoreSearch()" class="btn-full" style="background: #10b981;">
                <i class="fab fa-app-store-ios"></i> بحث في المتجر (سريع)
            </button>
            <button onclick="openEditModal()" class="btn-full" style="background: #3b82f6;">
                <i class="fas fa-pen"></i> إضافة يدوية
            </button>
            <button onclick="closeModal('addChoiceModal')" class="btn-full btn-cancel">إلغاء</button>
        </div>
    </div>

    <div id="storeSearchModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">بحث تطبيقات</div>
            <div style="position:relative;">
                <input type="text" id="storeSearchInput" placeholder="اكتب اسم التطبيق..." style="padding-right:40px;">
                <button onclick="searchStore()" style="position:absolute; right:10px; top:10px; background:none; border:none; color:var(--primary); font-size:1.1rem;">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div id="storeSearchResults" style="max-height: 280px; overflow-y: auto; margin-top: 15px;"></div>
            <button onclick="closeModal('storeSearchModal')" class="btn-full btn-cancel" style="margin-top:15px;">إغلاق</button>
        </div>
    </div>

    <div id="appModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">بيانات التطبيق</div>
            
            <select id="appCat"></select>
            <input type="text" id="appName" placeholder="اسم التطبيق">
            
            <div style="display:flex; gap:5px; align-items: center;">
                <input type="text" id="appImgUrl" placeholder="رابط الأيقونة" style="direction:ltr;">
                <img id="previewImg" src="" style="width:40px; height:40px; border-radius:8px; display:none; background:#334155;">
            </div>

            <input type="text" id="appLink" placeholder="رابط التحميل" style="direction:ltr;">
            
            <div style="display:flex; justify-content:space-between; padding:10px; background:#0f172a; border-radius:12px; margin:10px 0; border:1px solid #334155;">
                <span style="color:#cbd5e1; font-size:0.9rem;">إخفاء التطبيق؟</span>
                <input type="checkbox" id="appHidden" style="width:20px; margin:0;">
            </div>

            <button onclick="saveApp()" id="saveBtn" class="btn-full btn-confirm">حفظ</button>
            <button onclick="confirmDeleteApp()" id="delBtn" class="btn-full btn-danger" style="display:none;">حذف</button>
            <button onclick="closeModal('appModal')" class="btn-full btn-cancel">إغلاق</button>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">الإعدادات</div>
            
            <div id="settingsMain">
                <div class="settings-menu-btn" onclick="openSettingsSection('catLock')">
                    <span><i class="fas fa-folder-open" style="margin-left:10px; color:#f59e0b;"></i> إدارة الأقسام</span>
                    <i class="fas fa-chevron-left"></i>
                </div>
                
                <div class="settings-menu-btn" onclick="openSettingsSection('sidebarEdit')">
                    <span><i class="fas fa-share-alt" style="margin-left:10px; color:#10b981;"></i> روابط التواصل</span>
                    <i class="fas fa-chevron-left"></i>
                </div>
                
                <button onclick="cleanBase64Images()" class="settings-menu-btn" style="border-color: var(--danger); color: var(--danger); justify-content: center; margin-top: 20px;">
                    <i class="fas fa-broom" style="margin-left:8px;"></i> تنظيف وتسريع
                </button>

                <button onclick="closeModal('settingsModal')" class="btn-full btn-cancel" style="margin-top:10px;">إغلاق</button>
            </div>

            <div id="catLockSection" class="settings-section" style="display:none;">
                <div class="modal-title" style="font-size:1rem;">الأقسام الحالية</div>
                <div id="catLockList" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
                
                <div style="border-top:1px solid #334155; padding-top:10px;">
                    <input type="text" id="newCatName" placeholder="اسم قسم جديد (مثال: ألعاب)">
                    <button onclick="addNewCategory()" class="btn-full btn-confirm" style="margin-top:5px;">إضافة قسم</button>
                </div>
                <button onclick="backToSettingsMain()" class="btn-full btn-cancel" style="margin-top:10px;">رجوع</button>
            </div>

            <div id="editCatSubSection" class="settings-section" style="display:none;">
                <div class="modal-title">تعديل القسم</div>
                <input type="text" id="editCatNameInput" placeholder="الاسم الجديد">
                <input type="text" id="editCatIconInput" placeholder="الأيقونة (Emoji)">
                <button onclick="saveCatEdit()" class="btn-full btn-confirm">حفظ التعديل</button>
                <button onclick="cancelCatEdit()" class="btn-full btn-cancel">إلغاء</button>
            </div>

            <div id="sidebarEditSection" class="settings-section" style="display:none;">
                <div class="modal-title" style="font-size:1rem;">الروابط الشخصية</div>
                <div id="sidebarLinksList" style="max-height:250px; overflow-y:auto; margin-bottom:10px;"></div>
                <button onclick="addSidebarLink()" class="btn-full" style="border:1px dashed #64748b; background: rgba(255,255,255,0.05);">+ رابط جديد</button>
                <button onclick="saveSidebar()" class="btn-full btn-confirm" style="margin-top:10px;">حفظ القائمة</button>
                <button onclick="backToSettingsMain()" class="btn-full btn-cancel">رجوع</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="z-index: 4000;">
        <div class="modal-box">
            <div style="font-size:3rem; margin-bottom:10px;">⚠️</div>
            <div id="confirmTitle" class="modal-title">هل أنت متأكد؟</div>
            <div id="confirmMsg" style="color:#94a3b8; margin-bottom:20px;"></div>
            <div style="display:flex; gap:10px;">
                <button id="confirmYesBtn" class="btn-full btn-danger">نعم، احذف</button>
                <button onclick="closeModal('confirmModal')" class="btn-full btn-cancel">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="modal-overlay" style="z-index: 5000;">
        <div class="modal-box">
            <div id="alertIcon" style="font-size:3rem; margin-bottom:15px;">✨</div>
            <div id="alertTitle" class="modal-title">تم</div>
            <div id="alertMsg" style="color:#94a3b8; margin-bottom:20px;"></div>
            <button onclick="closeModal('alertModal')" class="btn-full btn-confirm">حسناً</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
            authDomain: "mohammadalboushi-e9231.firebaseapp.com",
            projectId: "mohammadalboushi-e9231",
            databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
            appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2";

        // متغيرات الحالة
        let allApps = {};
        let allCats = {};
        let siteSettings = {};
        let editKey = null;
        let editCatKey = null; // مفتاح القسم الجاري تعديله
        let currentFilter = 'ALL';
        let sortMethod = 'DATE'; // DATE, MANUAL
        let gridCols = 2;
        let isDragging = false;
        let appSortable = null;

        // التحقق من الدخول
        onAuthStateChanged(auth, (user) => {
            if (user && user.uid === myUID) {
                document.getElementById('loginBtn').style.display = 'none';
                initData();
            } else {
                document.getElementById('loginBtn').style.display = 'flex';
                document.getElementById('appsContainer').innerHTML = "<div style='grid-column:span 2; text-align:center;'>يرجى تسجيل الدخول</div>";
            }
        });

        window.login = () => signInWithPopup(auth, new GoogleAuthProvider());

        function initData() {
            // تحميل الأقسام
            onValue(ref(db, 'categories'), (s) => {
                const val = s.val();
                if(!val) update(ref(db, 'categories'), { 'PROGRAM': { name: 'تطبيقات', icon: '📱', order: 1 } });
                else {
                    allCats = val;
                    renderTabs();
                    // تحديث قائمة الأقسام في الإعدادات إذا كانت مفتوحة
                    if(document.getElementById('catLockSection').style.display === 'block') {
                        renderCatLockList();
                    }
                }
            });

            // تحميل التطبيقات (مع منع التحديث أثناء السحب)
            onValue(ref(db, 'apps'), (s) => {
                allApps = s.val() || {};
                if (!isDragging) renderApps();
            });

            // تحميل الإعدادات (روابط فقط)
            onValue(ref(db, 'settings'), (s) => {
                siteSettings = s.val() || {};
            });
        }

        // ================== العرض والترتيب ==================

        function renderApps() {
            const container = document.getElementById('appsContainer');
            
            // تحويل البيانات لمصفوفة
            let sortedArray = Object.entries(allApps);

            // تصفية
            if(currentFilter !== 'ALL') {
                sortedArray = sortedArray.filter(([,v]) => v.type === currentFilter);
            }

            // ترتيب
            if(sortMethod === 'DATE') {
                sortedArray.sort(([,a], [,b]) => (b.lastModified || 0) - (a.lastModified || 0));
            } else {
                // يدوي
                sortedArray.sort(([,a], [,b]) => (a.order || 0) - (b.order || 0));
            }

            // بناء HTML
            let html = '';
            if(sortedArray.length === 0) {
                html = `<div style="grid-column:span var(--grid-cols); text-align:center; color:#64748b; padding:40px;">لا توجد تطبيقات في هذا القسم</div>`;
            } else {
                sortedArray.forEach(([k, v]) => {
                    const isHidden = v.isHidden ? 'opacity:0.5; filter:grayscale(1);' : '';
                    const manualUI = sortMethod === 'MANUAL' ? '<div class="drag-handle"><i class="fas fa-bars"></i></div>' : '';
                    
                    html += `
                        <div class="card" data-key="${k}" style="${isHidden}" onclick="cardClick(event, '${k}')">
                            ${manualUI}
                            <div class="edit-badge">تعديل</div>
                            <img src="${v.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/564/564619.png'">
                            <div class="card-title">${v.name}</div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;

            // تفعيل السحب فقط في الوضع اليدوي
            setupSortable();
        }

        window.cardClick = (e, key) => {
            // منع الفتح عند الضغط على مقبض السحب
            if(e.target.classList.contains('drag-handle')) return;
            openEditModal(key, allApps[key]);
        };

        function setupSortable() {
            const container = document.getElementById('appsContainer');
            if (appSortable) appSortable.destroy();

            if (sortMethod === 'MANUAL') {
                appSortable = new Sortable(container, {
                    handle: '.drag-handle',
                    animation: 200,
                    ghostClass: 'sortable-ghost',
                    onStart: () => { isDragging = true; },
                    onEnd: (evt) => {
                        isDragging = false;
                        // حفظ الترتيب الجديد
                        const updates = {};
                        [...container.children].forEach((el, index) => {
                            const key = el.getAttribute('data-key');
                            if(key) updates[`apps/${key}/order`] = index;
                        });
                        update(ref(db), updates);
                    }
                });
            }
        }

        window.renderTabs = () => {
            const container = document.getElementById('tabsList');
            const select = document.getElementById('appCat');
            
            // ترتيب الأقسام حسب Order
            const sortedCats = Object.entries(allCats).sort(([,a], [,b]) => (a.order || 0) - (b.order || 0));
            
            let tabs = `<button class="tab-btn ${currentFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">الكل</button>`;
            let opts = '';
            
            sortedCats.forEach(([k, v]) => {
                // إخفاء الأقسام المقفلة من التابات العلوية إذا لم نكن في وضع التعديل (اختياري)
                // هنا سنعرضها مع علامة قفل
                const lockIcon = v.isHidden ? '🔒' : '';
                tabs += `<button class="tab-btn ${currentFilter === k ? 'active' : ''}" onclick="setFilter('${k}')">${lockIcon} ${v.icon || ''} ${v.name}</button>`;
                opts += `<option value="${k}">${v.name}</option>`;
            });
            
            container.innerHTML = tabs;
            select.innerHTML = opts;
        };

        window.setFilter = (f) => { currentFilter = f; renderApps(); };
        window.toggleSort = () => {
            sortMethod = (sortMethod === 'DATE') ? 'MANUAL' : 'DATE';
            document.getElementById('sortIcon').className = (sortMethod === 'DATE') ? 'fas fa-sort' : 'fas fa-sort-amount-down';
            showAlert("الترتيب", sortMethod === 'DATE' ? "الأحدث أولاً" : "الترتيب اليدوي مفعل", "✅");
            renderApps();
        };
        window.toggleLayout = () => {
            gridCols = gridCols === 2 ? 1 : 2;
            document.documentElement.style.setProperty('--grid-cols', gridCols);
        };

        // ================== البحث في المتجر (Fixed) ==================

        window.openStoreSearch = () => {
            closeModal('addChoiceModal');
            document.getElementById('storeSearchModal').style.display = 'flex';
            document.getElementById('storeSearchInput').focus();
        };

        window.searchStore = async () => {
            const q = document.getElementById('storeSearchInput').value;
            const resDiv = document.getElementById('storeSearchResults');
            if(!q) return;

            resDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#3b82f6;"><i class="fas fa-spinner fa-spin"></i> جاري البحث...</div>';

            try {
                // استخدام AllOrigins كبروكسي موثوق لتجاوز CORS
                // نقوم بتشفير الرابط الخاص بـ iTunes
                const targetUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=software&country=SA&limit=10`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const dataWrapper = await response.json();
                
                // AllOrigins يعيد البيانات داخل خاصية contents كنص
                const data = JSON.parse(dataWrapper.contents);

                resDiv.innerHTML = '';
                if (!data.results || data.results.length === 0) {
                    resDiv.innerHTML = '<div style="text-align:center; padding:10px;">لم يتم العثور على نتائج</div>';
                    return;
                }

                data.results.forEach(app => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.onclick = () => {
                        closeModal('storeSearchModal');
                        openEditModal(null); // فتح مودال الإضافة
                        
                        document.getElementById('appName').value = app.trackName;
                        // محاولة الحصول على صورة عالية الدقة
                        const bigImg = app.artworkUrl512 || app.artworkUrl100;
                        document.getElementById('appImgUrl').value = bigImg;
                        document.getElementById('previewImg').src = bigImg;
                        document.getElementById('previewImg').style.display = 'block';
                        
                        // رابط متجر بلاي افتراضي باستخدام Bundle ID (حيلة)
                        document.getElementById('appLink').value = `https://play.google.com/store/apps/details?id=${app.bundleId}`;
                    };

                    item.innerHTML = `
                        <img src="${app.artworkUrl60}">
                        <div style="flex-grow:1;">
                            <div style="font-weight:bold; font-size:0.9rem;">${app.trackName}</div>
                            <div style="font-size:0.75rem; color:#94a3b8;">${app.artistName}</div>
                        </div>
                        <i class="fas fa-plus-circle" style="color:#10b981; font-size:1.2rem;"></i>
                    `;
                    resDiv.appendChild(item);
                });

            } catch (e) {
                console.error(e);
                resDiv.innerHTML = '<div style="text-align:center; color:#ef4444;">حدث خطأ في الاتصال، حاول مجدداً</div>';
            }
        };

        // ================== إدارة التطبيقات ==================

        window.openEditModal = (key, data) => {
            closeModal('addChoiceModal');
            document.getElementById('appModal').style.display = 'flex';
            
            if(key) {
                editKey = key;
                document.getElementById('appCat').value = data.type;
                document.getElementById('appName').value = data.name;
                document.getElementById('appImgUrl').value = data.img;
                document.getElementById('appLink').value = data.link;
                document.getElementById('appHidden').checked = data.isHidden;
                document.getElementById('previewImg').src = data.img;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('delBtn').style.display = 'block';
                document.getElementById('saveBtn').innerText = 'حفظ التعديلات';
            } else {
                editKey = null;
                document.getElementById('appName').value = '';
                document.getElementById('appImgUrl').value = '';
                document.getElementById('appLink').value = '';
                document.getElementById('appHidden').checked = false;
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('delBtn').style.display = 'none';
                document.getElementById('saveBtn').innerText = 'إضافة التطبيق';
            }
        };

        window.saveApp = () => {
            const d = {
                name: document.getElementById('appName').value,
                link: document.getElementById('appLink').value,
                type: document.getElementById('appCat').value,
                img: document.getElementById('appImgUrl').value,
                isHidden: document.getElementById('appHidden').checked,
                lastModified: Date.now()
            };

            if(!d.name || !d.img) return showAlert("نقص بيانات", "الاسم والصورة مطلوبان!", "⚠️");

            if(editKey) {
                d.order = allApps[editKey].order || 0;
                update(ref(db, 'apps/'+editKey), d);
            } else {
                d.order = 9999; // يظهر في النهاية
                push(ref(db, 'apps'), d);
            }
            closeModal('appModal');
        };

        window.confirmDeleteApp = () => {
            showConfirm("سيتم حذف التطبيق نهائياً.", () => {
                remove(ref(db, 'apps/'+editKey));
                closeModal('appModal');
            });
        };

        // ================== إدارة الأقسام (جديد) ==================

        function renderCatLockList() {
            const list = document.getElementById('catLockList');
            list.innerHTML = '';
            
            Object.entries(allCats).forEach(([k, v]) => {
                const div = document.createElement('div');
                div.className = 'cat-manage-item';
                
                // حالة القفل
                const isLocked = v.isHidden === true;
                const lockColor = isLocked ? '#f59e0b' : '#334155';
                const lockIcon = isLocked ? 'fa-lock' : 'fa-lock-open';

                div.innerHTML = `
                    <span style="font-weight:bold; ${isLocked ? 'color:#f59e0b;' : ''}">
                        ${v.icon || '📁'} ${v.name}
                    </span>
                    <div class="cat-actions">
                        <i class="fas fa-pen" style="color:#3b82f6;" onclick="openEditCatModal('${k}', '${v.name}', '${v.icon||''}')"></i>
                        
                        <i class="fas ${lockIcon}" style="color:${lockColor};" onclick="toggleCatLock('${k}', ${isLocked})"></i>
                        
                        <i class="fas fa-trash" style="color:#ef4444;" onclick="confirmDeleteCat('${k}')"></i>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        window.toggleCatLock = (k, currentStatus) => {
            update(ref(db, `categories/${k}/isHidden`), !currentStatus);
            // لا حاجة لإعادة الرسم يدوياً لأن onValue سيعمل، لكن لسرعة الاستجابة:
            // سيتم تحديث القائمة تلقائياً
        };

        window.addNewCategory = () => {
            const name = document.getElementById('newCatName').value;
            if(!name) return;
            const id = 'CAT_' + Date.now();
            update(ref(db, `categories/${id}`), {
                name: name, icon: '📁', order: 99
            });
            document.getElementById('newCatName').value = '';
        };

        window.confirmDeleteCat = (k) => {
            showConfirm("هل تريد حذف هذا القسم؟ لن يتم حذف التطبيقات بداخله لكنها ستختفي.", () => {
                remove(ref(db, `categories/${k}`));
            });
        };

        // تعديل اسم القسم
        window.openEditCatModal = (k, name, icon) => {
            editCatKey = k;
            document.getElementById('catLockSection').style.display = 'none';
            document.getElementById('editCatSubSection').style.display = 'block';
            document.getElementById('editCatNameInput').value = name;
            document.getElementById('editCatIconInput').value = icon;
        };

        window.saveCatEdit = () => {
            if(!editCatKey) return;
            const n = document.getElementById('editCatNameInput').value;
            const i = document.getElementById('editCatIconInput').value;
            update(ref(db, `categories/${editCatKey}`), { name: n, icon: i });
            cancelCatEdit();
        };

        window.cancelCatEdit = () => {
            editCatKey = null;
            document.getElementById('editCatSubSection').style.display = 'none';
            document.getElementById('catLockSection').style.display = 'block';
        };

        // ================== السايدبار ==================

        function renderSidebarLinks() {
            const list = document.getElementById('sidebarLinksList');
            list.innerHTML = '';
            const links = siteSettings.links || [];
            
            links.forEach((l, idx) => {
                const div = document.createElement('div');
                div.className = 'cat-manage-item';
                div.innerHTML = `
                    <div style="flex-grow:1;">
                        <input type="text" class="lnk-name" value="${l.name}" placeholder="الاسم" style="margin:2px 0;">
                        <input type="text" class="lnk-url" value="${l.url}" placeholder="الرابط" style="margin:2px 0; direction:ltr; font-size:0.8rem;">
                    </div>
                    <i class="fas fa-trash" style="color:red; margin-right:10px; cursor:pointer;" onclick="this.parentElement.remove()"></i>
                `;
                list.appendChild(div);
            });
        }

        window.addSidebarLink = () => {
            const list = document.getElementById('sidebarLinksList');
            const div = document.createElement('div');
            div.className = 'cat-manage-item';
            div.innerHTML = `
                <div style="flex-grow:1;">
                    <input type="text" class="lnk-name" placeholder="الاسم (واتساب)" style="margin:2px 0;">
                    <input type="text" class="lnk-url" placeholder="الرابط" style="margin:2px 0; direction:ltr; font-size:0.8rem;">
                </div>
                <i class="fas fa-trash" style="color:red; margin-right:10px; cursor:pointer;" onclick="this.parentElement.remove()"></i>
            `;
            list.appendChild(div);
        };

        window.saveSidebar = () => {
            const rows = document.querySelectorAll('#sidebarLinksList .cat-manage-item');
            const links = [];
            rows.forEach(r => {
                links.push({
                    name: r.querySelector('.lnk-name').value,
                    url: r.querySelector('.lnk-url').value
                });
            });
            update(ref(db, 'settings/links'), links).then(() => {
                showAlert("تم", "تم حفظ الروابط", "✅");
            });
        };

        // ================== تنظيف الصور ==================
        window.cleanBase64Images = () => {
            showConfirm("سيتم حذف النصوص الطويلة (Base64) من الصور لتسريع الموقع.", () => {
                onValue(ref(db, 'apps'), (snap) => {
                    const d = snap.val();
                    const updates = {};
                    let count = 0;
                    for(let k in d) {
                        if(d[k].img && d[k].img.length > 500) {
                            updates[`apps/${k}/img`] = 'https://cdn-icons-png.flaticon.com/512/564/564619.png';
                            count++;
                        }
                    }
                    if(count > 0) update(ref(db), updates);
                    showAlert("تم التنظيف", `تم إصلاح ${count} صورة.`, "🚀");
                }, {onlyOnce: true});
            });
        };

        // ================== أدوات مساعدة ==================

        window.openSettingsModal = () => {
            document.getElementById('settingsModal').style.display = 'flex';
            backToSettingsMain();
        };

        window.openSettingsSection = (id) => {
            document.getElementById('settingsMain').style.display = 'none';
            document.getElementById(id + 'Section').style.display = 'block';
            if(id === 'catLock') renderCatLockList();
            if(id === 'sidebarEdit') renderSidebarLinks();
        };

        window.backToSettingsMain = () => {
            document.querySelectorAll('.settings-section').forEach(e => e.style.display = 'none');
            document.getElementById('settingsMain').style.display = 'block';
        };

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.openAddChoiceModal = () => document.getElementById('addChoiceModal').style.display = 'flex';
        
        window.showAlert = (title, msg, icon) => {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertIcon').innerText = icon;
            document.getElementById('alertModal').style.display = 'flex';
        };

        window.showConfirm = (msg, callback) => {
            document.getElementById('confirmMsg').innerText = msg;
            const modal = document.getElementById('confirmModal');
            modal.style.display = 'flex';
            
            const yesBtn = document.getElementById('confirmYesBtn');
            // إزالة المستمعين السابقين لتجنب التكرار
            const newBtn = yesBtn.cloneNode(true);
            yesBtn.parentNode.replaceChild(newBtn, yesBtn);
            
            newBtn.onclick = () => {
                callback();
                modal.style.display = 'none';
            };
        };

    </script>
</body>
</html>
