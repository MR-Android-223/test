<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin V15 | الترتيب والسحب</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); text-align: center; margin: 0; padding: 20px; padding-bottom: 100px; }
        
        .header-tools { display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 0 auto 15px; }
        .icon-btn { background: var(--card); color: white; border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }

        .box { background: var(--card); padding: 25px; border-radius: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; outline: none; font-size: 1rem; box-sizing: border-box; }
        input, select { background: #334155; color: white; }
        
        .upload-area { border: 2px dashed #334155; padding: 15px; border-radius: 12px; margin: 10px 0; cursor: pointer; }
        #previewImg { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; display: none; margin: 10px auto; border: 2px solid var(--primary); }
        
        /* القائمة */
        .app-item { display: flex; align-items: center; background: #334155; padding: 10px; margin-top: 10px; border-radius: 12px; touch-action: none; /* مهم للموبايل */ }
        .app-item.hidden-item { opacity: 0.5; border: 1px dashed #94a3b8; }
        .drag-handle { cursor: grab; padding: 0 10px; font-size: 1.2rem; color: #64748b; }
        
        .select-check { width: 20px; height: 20px; margin-left: 10px; cursor: pointer; display: none; }
        .show-checks .select-check { display: block; }

        /* شريط الإجراءات */
        #bulkActionsBar { position: fixed; bottom: -100px; left: 0; width: 100%; background: var(--card); padding: 15px; transition: 0.3s; z-index: 100; display: flex; justify-content: space-around; }
        #bulkActionsBar.visible { bottom: 0; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #334155; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 20px; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(20px); }

        #toast { visibility: hidden; min-width: 200px; background: #10b981; color: white; padding: 15px; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); border-radius: 50px; z-index: 3000; }
        #toast.show { visibility: visible; animation: fade 0.5s; }
        @keyframes fade { from {bottom: 0; opacity: 0;} to {bottom: 80px; opacity: 1;} }
    </style>
</head>
<body>

<div id="toast">✅ تم</div>

<div id="settingsModal" class="modal-overlay">
    <div class="modal-box">
        <h3>⚙️ إعدادات الأقسام</h3>
        <div id="categoriesSettings"></div>
        <button onclick="closeSettings()" style="background:#475569; color:white; margin-top:20px;">إغلاق</button>
    </div>
</div>

<div class="header-tools" id="headerTools" style="display:none;">
    <h2 style="margin:0;">لوحة المدير</h2>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
</div>

<div class="box">
    <div id="loginArea">
        <h2>🔐 دخول المدير</h2>
        <button onclick="login()" style="background:#ea4335; color:white;">دخول Google</button>
    </div>

    <div id="adminArea" style="display:none;">
        
        <div id="inputForm">
            <h3 id="formTitle" style="margin-top:0;">✨ إضافة جديد</h3>
            <select id="inputType">
                <option value="PROGRAM">📱 تطبيق</option>
                <option value="GAME">🎮 لعبة</option>
                <option value="WEBSITE">🌐 موقع</option>
                <option value="FILE">📁 ملف</option>
            </select>
            <input type="text" id="appName" placeholder="الاسم">
            <input type="text" id="appLink" placeholder="الرابط">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <span id="uploadLabel">📸 صورة</span>
                <input type="file" id="fileInput" hidden accept="image/*" onchange="processImage()">
                <img id="previewImg">
            </div>
            <button id="saveBtn" style="background: linear-gradient(45deg, #2563eb, #3b82f6); color: white;" onclick="handleProcess()">🚀 حفظ ونشر</button>
            <button id="cancelBtn" style="display:none; background:#475569; color:white;" onclick="resetForm()">إلغاء</button>
        </div>

        <hr style="border-color:#334155; margin:25px 0;">
        
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.8rem; color:#94a3b8;">اضغط مطولاً للسحب والترتيب ↕️</span>
            <button id="selectModeBtn" onclick="toggleSelectionMode()" style="width:auto; padding:5px 15px; font-size:0.8rem;">✅ تحديد</button>
        </div>

        <div id="appsList">جاري التحميل...</div>
    </div>
</div>

<div id="bulkActionsBar">
    <button onclick="bulkDelete()" style="background:#ef4444; color:white; border:none; padding:10px; border-radius:10px;">🗑️ حذف</button>
    <button onclick="bulkToggleVisibility()" style="background:#f59e0b; color:white; border:none; padding:10px; border-radius:10px;">👁️ إخفاء/إظهار</button>
    <button onclick="toggleSelectionMode()" style="background:#475569; color:white; border:none; padding:10px; border-radius:10px;">❌ إلغاء</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, update, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
        authDomain: "mohammadalboushi-e9231.firebaseapp.com",
        projectId: "mohammadalboushi-e9231",
        databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
        appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();
    const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2"; // تأكد من ال UID

    let editKey = null;
    let currentImgBase64 = "";
    let allDataCache = {};
    let isSelectMode = false;
    let selectedItems = new Set();

    // تشغيل مكتبة السحب
    new Sortable(document.getElementById('appsList'), {
        handle: '.drag-handle', // السحب من الأيقونة فقط
        animation: 150,
        onEnd: function (evt) {
            saveOrder(); // حفظ الترتيب الجديد عند الإفلات
        }
    });

    // دالة حفظ الترتيب الجديد في فايربيس
    function saveOrder() {
        const items = document.querySelectorAll('.app-item');
        const updates = {};
        items.forEach((item, index) => {
            const key = item.getAttribute('data-key');
            updates[`apps/${key}/order`] = index;
        });
        update(ref(db), updates).then(() => msg("✅ تم حفظ الترتيب"));
    }

    onAuthStateChanged(auth, (user) => {
        if (user && user.uid === myUID) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('adminArea').style.display = 'block';
            document.getElementById('headerTools').style.display = 'flex';
            loadData();
            loadSettings();
        }
    });

    window.login = () => signInWithPopup(auth, provider);

    window.processImage = () => {
        const file = document.getElementById('fileInput').files[0];
        if (file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const scale = 200 / img.width;
                    canvas.width = 200; canvas.height = img.height * scale;
                    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentImgBase64 = canvas.toDataURL("image/jpeg", 0.7);
                    document.getElementById('previewImg').src = currentImgBase64;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('uploadLabel').innerText = "✅";
                }
            }
        }
    };

    window.handleProcess = async () => {
        const name = document.getElementById('appName').value;
        const link = document.getElementById('appLink').value;
        const type = document.getElementById('inputType').value;
        const btn = document.getElementById('saveBtn');

        if (!name || !link) return alert("البيانات ناقصة");
        btn.disabled = true; btn.innerText = "⏳...";

        try {
            const data = { 
                name, link, type, 
                img: currentImgBase64 || "https://cdn-icons-png.flaticon.com/512/564/564619.png",
                isHidden: false,
                order: 9999 // ترتيب افتراضي
            };

            if (editKey) {
                await update(ref(db, 'apps/' + editKey), data);
                msg("✅ تم التعديل");
            } else {
                await push(ref(db, 'apps'), data);
                msg("🚀 تم النشر");
            }
            resetForm();
        } catch (e) { alert("خطأ: " + e.message); }
        btn.disabled = false; btn.innerText = "🚀 حفظ ونشر";
    };

    function loadData() {
        onValue(ref(db, 'apps'), (s) => {
            const val = s.val();
            allDataCache = val || {};
            renderList();
        });
    }

    // عرض القائمة مرتبة حسب الـ Order
    function renderList() {
        const list = document.getElementById('appsList');
        list.innerHTML = "";
        
        // تحويل البيانات لمصفوفة وترتيبها
        const sortedArray = Object.entries(allDataCache).sort(([,a], [,b]) => {
            return (a.order || 0) - (b.order || 0);
        });

        sortedArray.forEach(([k, v]) => {
            const isHidden = v.isHidden === true;
            const div = document.createElement('div');
            div.className = `app-item ${isHidden ? 'hidden-item' : ''}`;
            div.setAttribute('data-key', k);
            div.innerHTML = `
                <span class="drag-handle">☰</span>
                <input type="checkbox" class="select-check" onchange="toggleItem('${k}', this)">
                <div style="display:flex; align-items:center; gap:10px; flex-grow:1; margin-right:10px;">
                    <img src="${v.img}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;">
                    <div style="text-align:right;">
                        <strong>${v.name}</strong> ${isHidden ? '<small>👁️‍🗨️</small>' : ''}<br>
                        <span style="font-size:0.7rem; color:#94a3b8;">${v.type}</span>
                    </div>
                </div>
                <button onclick="startEdit('${k}','${v.name}','${v.link}','${v.img}','${v.type}')" style="background:#3b82f6; color:white; border:none; padding:5px 10px; border-radius:8px;">✏️</button>
            `;
            list.appendChild(div);
        });
        
        if (isSelectMode) {
            list.classList.add('show-checks');
            document.querySelectorAll('.select-check').forEach(cb => {
                const key = cb.getAttribute('onchange').match(/'([^']+)'/)[1];
                if (selectedItems.has(key)) cb.checked = true;
            });
        }
    }

    // دوال التحديد
    window.toggleSelectionMode = () => {
        isSelectMode = !isSelectMode;
        selectedItems.clear();
        const bar = document.getElementById('bulkActionsBar');
        const list = document.getElementById('appsList');
        
        if (isSelectMode) {
            list.classList.add('show-checks');
            bar.classList.add('visible');
            document.getElementById('selectModeBtn').innerText = "إلغاء";
        } else {
            list.classList.remove('show-checks');
            bar.classList.remove('visible');
            document.getElementById('selectModeBtn').innerText = "✅ تحديد";
        }
        renderList();
    };

    window.toggleItem = (k, cb) => {
        if(cb.checked) selectedItems.add(k); else selectedItems.delete(k);
    };

    window.bulkDelete = async () => {
        if(confirm(`حذف ${selectedItems.size} عنصر؟`)) {
            const updates = {};
            selectedItems.forEach(k => updates[`apps/${k}`] = null);
            await update(ref(db), updates);
            msg("🗑️ تم الحذف");
            toggleSelectionMode();
        }
    };

    window.bulkToggleVisibility = async () => {
        const updates = {};
        selectedItems.forEach(k => {
            updates[`apps/${k}/isHidden`] = !allDataCache[k].isHidden;
        });
        await update(ref(db), updates);
        msg("👁️ تم التغيير");
        toggleSelectionMode();
    };

    // إعدادات الأقسام
    function loadSettings() {
        onValue(ref(db, 'settings/categories'), (s) => {
            const cats = s.val() || { PROGRAM: true, GAME: true, WEBSITE: true, FILE: true };
            const container = document.getElementById('categoriesSettings');
            container.innerHTML = '';
            const labels = { 'PROGRAM': 'التطبيقات', 'GAME': 'الألعاب', 'WEBSITE': 'المواقع', 'FILE': 'الملفات' };
            for(const [k, lbl] of Object.entries(labels)) {
                container.innerHTML += `
                    <div class="toggle-row">
                        <span>${lbl}</span>
                        <label class="switch">
                            <input type="checkbox" ${cats[k]!==false ? 'checked' : ''} onchange="toggleCat('${k}', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                `;
            }
        });
    }
    window.toggleCat = (k, val) => set(ref(db, `settings/categories/${k}`), val);
    window.openSettings = () => document.getElementById('settingsModal').style.display = 'flex';
    window.closeSettings = () => document.getElementById('settingsModal').style.display = 'none';
    
    // باقي الدوال
    window.startEdit = (k, n, l, i, t) => {
        editKey = k; currentImgBase64 = i;
        document.getElementById('appName').value = n;
        document.getElementById('appLink').value = l;
        document.getElementById('inputType').value = t;
        document.getElementById('previewImg').src = i;
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('formTitle').innerText = "✏️ تعديل";
        window.scrollTo(0,0);
    };
    window.resetForm = () => {
        editKey = null; currentImgBase64 = "";
        document.getElementById('appName').value = '';
        document.getElementById('appLink').value = '';
        document.getElementById('previewImg').style.display = 'none';
        document.getElementById('formTitle').innerText = "✨ إضافة جديد";
    };
    function msg(t) { const x = document.getElementById("toast"); x.innerText = t; x.className = "show"; setTimeout(() => x.className = "", 3000); }
</script>
</body>
</html>
