<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* الحقول */
        input, select, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: none; box-sizing: border-box; outline: none; font-size: 1rem; }
        input, select { background: #334155; color: white; transition: 0.3s; }
        input:focus { border-color: #3b82f6; background: #475569; }
        
        /* الأزرار الرئيسية */
        .action-btn { background: linear-gradient(45deg, #2563eb, #3b82f6); color: white; font-weight: bold; cursor: pointer; }
        .cancel-btn { background: #64748b; color: white; display: none; cursor: pointer; }
        
        /* شريط البحث */
        #searchBar { background: #0f172a; border: 1px solid #334155; padding: 10px; margin-bottom: 15px; text-align: center; }

        /* القائمة */
        .app-item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; margin-top: 10px; border-radius: 10px; text-align: right; border: 1px solid rgba(255,255,255,0.05); }
        .btn-group { display: flex; gap: 5px; }
        
        /* أزرار القائمة الصغيرة */
        .small-btn { width: auto; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; margin: 0; }
        .edit-btn { background: #f59e0b; color: white; } /* أصفر للتعديل */
        .delete-btn { background: #ef4444; color: white; } /* أحمر للحذف */

        /* النوافذ والاشعارات (نفس التصميم السابق) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 15px; width: 90%; max-width: 350px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        #toast { visibility: hidden; min-width: 250px; background-color: #10b981; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div id="toast">✅ تم</div>
<div id="confirmModal" class="modal-overlay">
    <div class="modal-box">
        <h3>تأكيد الحذف</h3>
        <p style="color:#cbd5e1;">حذف نهائي؟</p>
        <div class="modal-buttons">
            <button class="delete-btn" style="width:100%" onclick="confirmDelete()">نعم</button>
            <button class="cancel-btn" style="width:100%; display:block; background:#475569;" onclick="closeModal()">لا</button>
        </div>
    </div>
</div>

<div class="box">
    <div id="loginArea">
        <h2>🔐 دخول المدير</h2>
        <button onclick="login()" style="background:#ea4335; color:white;">تسجيل الدخول</button>
    </div>

    <div id="adminArea" style="display:none;">
        <h3 id="formTitle">✨ إضافة تطبيق جديد</h3>
        
        <input type="text" id="appName" placeholder="اسم التطبيق">
        <input type="text" id="appLink" placeholder="رابط التحميل">
        <input type="text" id="appImg" placeholder="رابط الصورة">
        <select id="appType">
            <option value="MOD">تطبيق معدل (MOD)</option>
            <option value="PDF">كتاب (PDF)</option>
            <option value="GAME">لعبة (GAME)</option>
        </select>
        
        <button id="mainBtn" class="action-btn" onclick="handleApp()">🚀 نشر التطبيق</button>
        <button id="cancelBtn" class="cancel-btn" onclick="resetForm()">إلغاء التعديل</button>

        <hr style="border-color: #334155; margin: 25px 0;">

        <input type="text" id="searchBar" placeholder="🔍 ابحث عن تطبيق..." onkeyup="filterApps()">

        <h4 style="text-align: right; margin-bottom:10px;">📦 التطبيقات:</h4>
        <div id="appsList">
            <p style="color:gray;">جاري التحميل...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
        authDomain: "mohammadalboushi-e9231.firebaseapp.com",
        projectId: "mohammadalboushi-e9231",
        databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
        appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();
    const myUID = "eBOYmcmDI5S6l4NQd36bEa5kEcZ2";

    let currentEditKey = null; // لتخزين معرف التطبيق الذي نعدله
    let targetDeleteKey = null;

    onAuthStateChanged(auth, (user) => {
        if (user && user.uid === myUID) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('adminArea').style.display = 'block';
            loadApps();
        } else {
            document.getElementById('loginArea').style.display = 'block';
            document.getElementById('adminArea').style.display = 'none';
        }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth); // زر الخروج موجود لكن مخفي لتوفير المساحة، يمكن إضافته

    // الدالة الذكية: تعمل إضافة أو تعديل حسب الوضع
    window.handleApp = () => {
        const name = document.getElementById('appName').value;
        const link = document.getElementById('appLink').value;
        const img = document.getElementById('appImg').value;
        const type = document.getElementById('appType').value;
        
        if(!name || !link) { showToast("⚠️ اكتب الاسم والرابط", "#ef4444"); return; }

        const appData = { name, link, img: img || 'https://cdn-icons-png.flaticon.com/512/564/564619.png', type };

        if (currentEditKey) {
            // حالة التعديل
            update(ref(db, 'apps/' + currentEditKey), appData)
            .then(() => {
                showToast("✅ تم تعديل التطبيق!");
                resetForm();
            });
        } else {
            // حالة الإضافة الجديدة
            push(ref(db, 'apps'), appData)
            .then(() => {
                showToast("🚀 تم النشر!");
                resetForm();
            });
        }
    };

    // تعبئة الحقول عند ضغط زر التعديل
    window.startEdit = (key, name, link, img, type) => {
        currentEditKey = key;
        document.getElementById('appName').value = name;
        document.getElementById('appLink').value = link;
        document.getElementById('appImg').value = img;
        document.getElementById('appType').value = type;

        // تغيير شكل الواجهة لوضع التعديل
        document.getElementById('formTitle').innerText = "✏️ تعديل: " + name;
        document.getElementById('mainBtn').innerText = "حفظ التعديلات";
        document.getElementById('mainBtn').style.background = "#f59e0b"; // برتقالي
        document.getElementById('cancelBtn').style.display = 'block';
        
        // الصعود للأعلى
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // إلغاء وضع التعديل
    window.resetForm = () => {
        currentEditKey = null;
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('formTitle').innerText = "✨ إضافة تطبيق جديد";
        document.getElementById('mainBtn').innerText = "🚀 نشر التطبيق";
        document.getElementById('mainBtn').style.background = "linear-gradient(45deg, #2563eb, #3b82f6)";
        document.getElementById('cancelBtn').style.display = 'none';
    };

    // تحميل القائمة
    function loadApps() {
        onValue(ref(db, 'apps'), (snapshot) => {
            const list = document.getElementById('appsList');
            list.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.entries(data).reverse().forEach(([key, val]) => {
                    const item = document.createElement('div');
                    item.className = 'app-item';
                    // تخزين الاسم للبحث
                    item.setAttribute('data-name', val.name.toLowerCase());
                    
                    item.innerHTML = `
                        <div style="flex-grow:1;">
                            <strong>${val.name}</strong><br>
                            <span style="font-size:0.7rem; color:#94a3b8;">${val.type}</span>
                        </div>
                        <div class="btn-group">
                            <button class="small-btn edit-btn" onclick="startEdit('${key}', '${val.name}', '${val.link}', '${val.img}', '${val.type}')">✏️</button>
                            <button class="small-btn delete-btn" onclick="askDelete('${key}')">🗑️</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } else { list.innerHTML = "<p>لا يوجد تطبيقات</p>"; }
        });
    }

    // وظيفة البحث
    window.filterApps = () => {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const items = document.querySelectorAll('.app-item');
        items.forEach(item => {
            const name = item.getAttribute('data-name');
            item.style.display = name.includes(query) ? 'flex' : 'none';
        });
    };

    // الحذف والاشعارات (كما هي)
    window.askDelete = (key) => { targetDeleteKey = key; document.getElementById('confirmModal').style.display = 'flex'; };
    window.closeModal = () => { targetDeleteKey = null; document.getElementById('confirmModal').style.display = 'none'; };
    window.confirmDelete = () => {
        if (targetDeleteKey) {
            remove(ref(db, 'apps/' + targetDeleteKey))
            .then(() => { showToast("🗑️ تم الحذف"); closeModal(); });
        }
    };
    function showToast(text, color = "#10b981") {
        const x = document.getElementById("toast");
        x.innerText = text; x.style.backgroundColor = color; x.className = "show";
        setTimeout(() => x.className = x.className.replace("show", ""), 3000);
    }
</script>
</body>
</html>
