<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.Al.Boushi Store</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--primary:#3b82f6;
--text:#f8fafc;
--muted:#94a3b8;
--border:rgba(255,255,255,.06);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:'Cairo',sans-serif;
background:var(--bg);
color:var(--text);
}

header{
position:sticky;
top:0;
z-index:100;
background:rgba(15,23,42,.95);
backdrop-filter:blur(10px);
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
border-bottom:1px solid var(--border);
}

.logo{
font-weight:800;
font-size:1.3rem;
}
.logo span{color:var(--primary)}

.hero{
padding:30px 20px;
text-align:center;
}

.search{
position:relative;
max-width:500px;
margin:0 auto;
}

.search input{
width:100%;
padding:14px 45px 14px 15px;
border-radius:14px;
border:1px solid #334155;
background:var(--card);
color:white;
font-size:1rem;
outline:none;
}

.search i{
position:absolute;
top:15px;
right:15px;
color:var(--muted);
}

.filters{
display:flex;
gap:10px;
overflow-x:auto;
padding:10px 20px;
}

.filter{
padding:6px 14px;
border-radius:20px;
background:#334155;
color:#e2e8f0;
font-size:.8rem;
white-space:nowrap;
cursor:pointer;
}

.filter.active{
background:var(--primary);
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

@media(min-width:768px){
.grid{grid-template-columns:repeat(4,1fr)}
}

.card{
background:var(--card);
border-radius:16px;
padding:15px;
text-align:center;
position:relative;
border:1px solid var(--border);
}

.card img{
width:70px;
height:70px;
border-radius:14px;
object-fit:cover;
margin-bottom:10px;
}

.card h4{
font-size:.9rem;
margin:0 0 10px;
height:38px;
overflow:hidden;
}

.badge{
position:absolute;
top:10px;
left:10px;
font-size:.65rem;
padding:3px 8px;
border-radius:6px;
background:rgba(59,130,246,.15);
color:var(--primary);
font-weight:bold;
}

.actions{
display:flex;
justify-content:space-between;
align-items:center;
}

.btn{
background:#334155;
color:white;
padding:6px 18px;
border-radius:20px;
font-size:.8rem;
cursor:pointer;
}

.fav{
color:#64748b;
cursor:pointer;
font-size:1.1rem;
}

.fav.active{color:#ef4444}

/* Skeleton */
.skeleton{
background:linear-gradient(90deg,#1e293b,#334155,#1e293b);
background-size:200% 100%;
animation:load 1.2s infinite;
}

@keyframes load{
0%{background-position:200% 0}
100%{background-position:-200% 0}
}

/* Modal */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
z-index:200;
}

.modal-box{
background:#020617;
border-radius:20px;
padding:20px;
width:90%;
max-width:350px;
text-align:center;
}

.modal-box img{
width:90px;
height:90px;
border-radius:18px;
margin-bottom:10px;
}

.modal-box h3{margin:10px 0}

.modal-box a{
display:block;
margin-top:15px;
background:var(--primary);
color:white;
padding:10px;
border-radius:25px;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<div class="logo">M.<span>Al.Boushi</span></div>
<i class="fas fa-bars"></i>
</header>

<section class="hero">
<h2>متجر التطبيقات</h2>
<p style="color:var(--muted)">تحميل برامج وملفات بشكل أنيق</p>

<div class="search">
<i class="fas fa-search"></i>
<input type="text" id="search" placeholder="ابحث...">
</div>
</section>

<div class="filters">
<div class="filter active" data-type="all">الكل</div>
<div class="filter" data-type="app">تطبيقات</div>
<div class="filter" data-type="pdf">PDF</div>
<div class="filter" data-type="img">صور</div>
<div class="filter" data-type="audio">صوت</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="modal-box">
<img id="mImg">
<h3 id="mTitle"></h3>
<a id="mLink" target="_blank">فتح</a>
</div>
</div>

<script>
const csvUrl="PUT_YOUR_CSV_LINK_HERE";
const grid=document.getElementById("grid");
const modal=document.getElementById("modal");
const favs=JSON.parse(localStorage.getItem("favs")||"[]");
let apps=[];

/* Skeleton */
for(let i=0;i<6;i++){
grid.innerHTML+=`
<div class="card">
<div class="skeleton" style="width:70px;height:70px;border-radius:14px;margin:0 auto 10px"></div>
<div class="skeleton" style="height:14px;border-radius:6px"></div>
</div>`;
}

fetch(csvUrl)
.then(r=>r.text())
.then(t=>{
grid.innerHTML="";
t.split("\n").forEach(r=>{
const c=r.split(",");
if(!c[0]||!c[1])return;

let type="app";
if(c[1].includes(".pdf"))type="pdf";
if(c[1].match(/\.(jpg|png)/))type="img";
if(c[1].match(/\.(mp3|wav)/))type="audio";

apps.push({
name:c[0].replace(/"/g,""),
link:c[1].replace(/"/g,""),
img:c[2]?.replace(/"/g,""),
type
});
});
render(apps);
});

function render(list){
grid.innerHTML="";
list.forEach(a=>{
const fav=favs.includes(a.name);
grid.innerHTML+=`
<div class="card" data-type="${a.type}">
<span class="badge">${a.type.toUpperCase()}</span>
<img loading="lazy" src="${a.img}">
<h4>${a.name}</h4>
<div class="actions">
<div class="btn" onclick="openModal('${a.name}','${a.img}','${a.link}')">عرض</div>
<i class="fas fa-heart fav ${fav?"active":""}" onclick="toggleFav('${a.name}',this)"></i>
</div>
</div>`;
});
}

function toggleFav(name,el){
if(favs.includes(name)){
favs.splice(favs.indexOf(name),1);
el.classList.remove("active");
}else{
favs.push(name);
el.classList.add("active");
}
localStorage.setItem("favs",JSON.stringify(favs));
}

function openModal(t,i,l){
modal.style.display="flex";
mTitle.textContent=t;
mImg.src=i;
mLink.href=l;
}
modal.onclick=()=>modal.style.display="none";

document.getElementById("search").oninput=e=>{
const v=e.target.value.toLowerCase();
render(apps.filter(a=>a.name.toLowerCase().includes(v)));
};

document.querySelectorAll(".filter").forEach(f=>{
f.onclick=()=>{
document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
f.classList.add("active");
const t=f.dataset.type;
render(t=="all"?apps:apps.filter(a=>a.type==t));
};
});
</script>

</body>
</html>
