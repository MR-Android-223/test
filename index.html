<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدير الديون (سحابي)</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- تصميم أساسي ونظيف --- */
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body {
            font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh;
        }

        /* --- الهيدر والقائمة --- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .title { font-size: 20px; font-weight: bold; color: var(--primary); }
        
        .menu-btn {
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* --- القائمة المنسدلة --- */
        .dropdown-menu {
            position: absolute; top: 70px; left: 20px; background: white;
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 250px; display: none; flex-direction: column; z-index: 1000;
            padding: 10px; border: 1px solid #e2e8f0;
        }
        .menu-item {
            padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            font-size: 14px; color: #475569; transition: 0.2s;
        }
        .menu-item:active { background: #f1f5f9; }
        .google-btn { color: var(--primary); font-weight: bold; background: #eff6ff; }

        /* --- المحتوى --- */
        .status-card {
            background: white; padding: 20px; border-radius: 16px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px;
        }
        .status-text { color: #64748b; margin-bottom: 10px; }
        .user-info { font-weight: bold; color: var(--text); display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="menu-btn" onclick="toggleMenu()">⋮</div>
        <div class="title">مدير الديون</div>
        <div style="width:40px"></div> </div>

    <div id="dropdownMenu" class="dropdown-menu">
        <div class="menu-item google-btn" onclick="startGoogleLogin()">
            🔑 تسجيل دخول Google
        </div>
        <div class="menu-item" onclick="alert('قريباً...')">♻️ مزامنة البيانات</div>
        <div class="menu-item" style="color:red" onclick="handleLogout()">🚪 خروج</div>
    </div>

    <div class="status-card">
        <div id="statusMsg" class="status-text">يجب تسجيل الدخول لعرض البيانات</div>
        <div id="userInfo" class="user-info"></div>
    </div>

    <script>
        // --- إعدادات جوجل ---
        const CLIENT_ID = '979816526016-ukb9vqtb6u2hlutombpf8rumbjr3o2ua.apps.googleusercontent.com';
        let tokenClient;
        let gAccessToken = localStorage.getItem('g_token');

        // تهيئة المكتبة عند التحميل
        window.onload = function() {
            if(window.google) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile',
                    callback: (resp) => {
                        if (resp.access_token) {
                            gAccessToken = resp.access_token;
                            localStorage.setItem('g_token', gAccessToken);
                            updateUI(true);
                        }
                    }
                });
                
                // إذا كان مسجلاً سابقاً
                if(gAccessToken) updateUI(true);
            }
        };

        // دالة بدء الدخول (تستدعى عند الضغط على الزر)
        function startGoogleLogin() {
            toggleMenu(); // إخفاء القائمة
            if(tokenClient) tokenClient.requestAccessToken();
        }

        // تحديث الواجهة
        function updateUI(isLoggedIn) {
            const msg = document.getElementById('statusMsg');
            const info = document.getElementById('userInfo');
            
            if(isLoggedIn) {
                msg.innerText = "✅ متصل بالسحابة";
                msg.style.color = "green";
                // هنا يمكنك استدعاء دالة جلب البيانات
            } else {
                msg.innerText = "يجب تسجيل الدخول لعرض البيانات";
                msg.style.color = "#64748b";
            }
        }

        function handleLogout() {
            localStorage.removeItem('g_token');
            gAccessToken = null;
            updateUI(false);
            toggleMenu();
            alert("تم تسجيل الخروج");
        }

        function toggleMenu() {
            const m = document.getElementById('dropdownMenu');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        // إغلاق القائمة عند النقر خارجها
        document.addEventListener('click', function(e) {
            const m = document.getElementById('dropdownMenu');
            const btn = document.querySelector('.menu-btn');
            if (!m.contains(e.target) && !btn.contains(e.target)) {
                m.style.display = 'none';
            }
        });
    </script>
</body>
</html>
