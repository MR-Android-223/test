<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
تطبيق الملاحظات السحابي
    </title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background: #0f172a; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: none; 
            border-radius: 8px; 
            background: #334155; 
            color: white; 
            box-sizing: border-box; 
            text-align: right;
        }
        input::placeholder {
            color: #94a3b8;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: 0.3s; 
        }
        .btn-primary { background: #8b5cf6; color: white; }
        .btn-secondary { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; margin-bottom: 20px; }
        .hidden { display: none; }
        .note-card { 
            background: #334155; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            border-right: 4px solid #8b5cf6; 
            color: white;
        }
        .title-text { 
            text-align: center; 
            color: #f8fafc; 
            margin-bottom: 20px; 
        }
        .error-msg { 
            color: #f87171; 
            text-align: center; 
            font-size: 14px; 
        }
    </style>
</head>
<body>

    <div class="container" id="authSection">
        <h2 class="title-text">
تسجيل الدخول
        </h2>
        <input type="email" id="email" placeholder="
البريد الإلكتروني
        ">
        <input type="password" id="password" placeholder="
كلمة المرور
        ">
        <button class="btn-primary" onclick="login()">
تسجيل دخول
        </button>
        <button class="btn-secondary" onclick="signup()">
إنشاء حساب جديد
        </button>
        <p id="authMessage" class="error-msg"></p>
    </div>

    <div class="container hidden" id="appSection">
        <h2 class="title-text">
ملاحظاتي السحابية
        </h2>
        <button class="btn-danger" onclick="logout()">
تسجيل خروج
        </button>
        <input type="text" id="noteInput" placeholder="
اكتب ملاحظة جديدة
        ">
        <button class="btn-primary" onclick="addNote()">
حفظ الملاحظة
        </button>
        <div id="notesList" style="margin-top: 20px;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBB_U4C880PW4GxZd8FALv8yBSiP2mNeBY",
            authDomain: "malaboushi.firebaseapp.com",
            projectId: "malaboushi",
            storageBucket: "malaboushi.firebasestorage.app",
            messagingSenderId: "110336819350",
            appId: "1:110336819350:web:2b1b0488e72b811f0602b7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const authMessage = document.getElementById('authMessage');
        let unsubscribe = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                loadNotes(user.uid);
            } else {
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
                if (unsubscribe) unsubscribe();
                document.getElementById('notesList').innerHTML = '';
            }
        });

        function signup() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            authMessage.innerText = '';
            auth.createUserWithEmailAndPassword(e, p).catch(err => {
                authMessage.innerText = "Error: " + err.message;
            });
        }

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            authMessage.innerText = '';
            auth.signInWithEmailAndPassword(e, p).catch(err => {
                authMessage.innerText = "Error: " + err.message;
            });
        }

        function logout() {
            auth.signOut();
        }

        function addNote() {
            const note = document.getElementById('noteInput').value;
            if (!note) return;
            const user = auth.currentUser;
            
            db.collection('test_notes').doc(user.uid).collection('items').add({
                text: note,
                time: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('noteInput').value = '';
            });
        }

        function loadNotes(uid) {
            unsubscribe = db.collection('test_notes').doc(uid).collection('items')
                .orderBy('time', 'desc')
                .onSnapshot(snap => {
                    const list = document.getElementById('notesList');
                    list.innerHTML = '';
                    snap.forEach(doc => {
                        const div = document.createElement('div');
                        div.className = 'note-card';
                        div.innerText = doc.data().text;
                        list.appendChild(div);
                    });
                });
        }
    </script>
</body>
</html>
