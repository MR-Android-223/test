<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Al.Boushi Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --primary: #3b82f6; }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); }
        
        /* مربع البحث */
        .search-box { max-width: 500px; margin: 20px auto; position: relative; }
        .search-box input { width: 100%; padding: 15px 45px 15px 20px; border-radius: 50px; border: none; background: var(--bg-card); color: white; font-family: 'Cairo'; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .search-box i { position: absolute; right: 20px; top: 16px; color: #94a3b8; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1000px; margin: 0 auto; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        /* الكرت */
        .card { background: var(--bg-card); border-radius: 16px; padding: 15px; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; position: relative; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card img { width: 70px; height: 70px; border-radius: 14px; margin-bottom: 10px; object-fit: cover; background: #000; }
        .card-title { font-size: 0.9rem; font-weight: bold; text-align: center; margin-bottom: 10px; height: 40px; overflow: hidden; }
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(59,130,246,0.1); color: var(--primary); font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; }
        .btn { background: var(--primary); color: white; padding: 5px 20px; border-radius: 20px; font-size: 0.8rem; }
        .loading { grid-column: span 2; text-align: center; color: #94a3b8; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.Al.Boushi</div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن تطبيق...">
        </div>
    </header>

    <div class="grid" id="container">
        <div class="loading">جاري جلب التطبيقات...</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
        authDomain: "mohammadalboushi-e9231.firebaseapp.com",
        projectId: "mohammadalboushi-e9231",
        databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
        appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const appsRef = ref(db, 'apps');

    // جلب البيانات تلقائياً
    onValue(appsRef, (snapshot) => {
        const container = document.getElementById('container');
        container.innerHTML = '';
        const data = snapshot.val();

        if (data) {
            Object.values(data).forEach(app => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = app.link;
                card.target = '_blank';
                card.innerHTML = `
                    <span class="badge">${app.type || 'MOD'}</span>
                    <img src="${app.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/564/564619.png'">
                    <div class="card-title">${app.name}</div>
                    <div class="btn">تحميل</div>
                `;
                container.appendChild(card);
            });
            // تشغيل البحث
            setupSearch();
        } else {
            container.innerHTML = '<div class="loading">لا توجد تطبيقات مضافة حالياً</div>';
        }
    });

    function setupSearch() {
        const input = document.getElementById('searchInput');
        const cards = document.querySelectorAll('.card');
        input.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            cards.forEach(card => {
                const text = card.querySelector('.card-title').innerText.toLowerCase();
                card.style.display = text.includes(val) ? 'flex' : 'none';
            });
        });
    }
</script>
</body>
</html>
