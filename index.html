<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* نفس ألوان الأدمن للتناسق */
            --bg-body: #0f172a; 
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
            --card-glass: rgba(30, 41, 59, 0.95); 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8;
            --primary: #3b82f6; 
            --border: rgba(255,255,255,0.08);
            --body-font: 'Cairo', sans-serif;
            --grid-cols: 2;
        }

        /* وضع النهار (اختياري) */
        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-gradient: radial-gradient(circle at 50% 0%, #e2e8f0, #f1f5f9);
            --card-glass: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: rgba(0,0,0,0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-body); 
            background-image: var(--bg-gradient);
            color: var(--text-main); 
            font-family: var(--body-font); 
            min-height: 100vh; 
            padding-bottom: 40px; 
            overflow-x: hidden; 
        }

        /* --- Header --- */
        header {
            position: sticky; top: 0; z-index: 1000; 
            background: rgba(15, 23, 42, 0.95);
            [data-theme="light"] & { background: rgba(255, 255, 255, 0.95); }
            border-bottom: 1px solid var(--border); 
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .logo { font-size: 1.3rem; font-weight: 900; }
        .logo span { color: var(--primary); }
        
        .header-btn { 
            width: 38px; height: 38px; border-radius: 12px;
            background: rgba(125,125,125,0.1); color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .header-btn:active { transform: scale(0.95); background: var(--primary); color: white; }

        /* --- Hero Section --- */
        .hero { text-align: center; padding: 30px 20px 10px; }
        .hero h1 { font-size: 1.6rem; color: var(--text-main); font-weight: 800; margin-bottom: 5px; }
        .hero p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; max-width: 500px; margin-inline: auto; }

        .search-box {
            position: relative; max-width: 500px; margin: 0 auto;
        }
        .search-box input {
            width: 100%; background: var(--card-glass); 
            border: 1px solid var(--border);
            padding: 14px 45px 14px 20px; border-radius: 16px; 
            color: var(--text-main); outline: none; transition: 0.3s;
            font-family: inherit;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .search-box i { position: absolute; right: 15px; top: 15px; color: var(--text-muted); }

        /* --- Tabs --- */
        .tabs-wrapper { position: sticky; top: 70px; z-index: 900; padding: 10px 0; background: transparent; }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: var(--card-glass); color: var(--text-muted); 
            border: 1px solid var(--border);
            padding: 8px 18px; border-radius: 50px; cursor: pointer; 
            font-family: inherit; font-weight: 700; font-size: 0.85rem; 
            white-space: nowrap; flex-shrink: 0; transition: 0.2s;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- Grid & Cards --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(var(--grid-cols), 1fr); 
            gap: 12px; padding: 10px 20px; 
            max-width: 900px; margin: 0 auto; 
        }
        
        .card {
            background: var(--card-glass); 
            border-radius: 18px; 
            padding: 15px; 
            text-decoration: none; 
            border: 1px solid var(--border); 
            display: flex; flex-direction: column; align-items: center; 
            position: relative; transition: 0.2s; 
            user-select: none;
        }
        .card:active { transform: scale(0.97); background: rgba(59, 130, 246, 0.05); }
        
        .card img { 
            width: 70px; height: 70px; border-radius: 16px; 
            margin-bottom: 10px; object-fit: cover; 
            background: #334155; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .card-title { 
            font-size: 0.85rem; font-weight: 700; text-align: center; 
            color: var(--text-main); margin-bottom: 10px; 
            line-height: 1.3; height: 36px; overflow: hidden; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
        }

        .get-btn {
            background: rgba(59, 130, 246, 0.1); color: var(--primary); 
            font-size: 0.8rem; font-weight: 700; padding: 6px 0; 
            border-radius: 50px; width: 100%; text-align: center; 
            transition: 0.2s;
        }
        .card:hover .get-btn { background: var(--primary); color: white; }

        /* --- Sidebar --- */
        .sidebar { 
            height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0; 
            background-color: #0f172a; [data-theme="light"] & { background: #fff; }
            overflow-x: hidden; transition: 0.3s; padding-top: 20px; 
            border-left: 1px solid var(--border); box-shadow: -5px 0 30px rgba(0,0,0,0.5); 
        }
        .sidebar-header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
        .sidebar-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 10px; object-fit: cover; }
        
        .sidebar-link { 
            display: flex; align-items: center; gap: 12px;
            margin: 8px 15px; padding: 12px; 
            background: rgba(255,255,255,0.03); 
            [data-theme="light"] & { background: #f8fafc; }
            border-radius: 12px; text-decoration: none; 
            color: var(--text-main); font-weight: 600; font-size: 0.9rem;
            border: 1px solid var(--border); transition: 0.2s;
        }
        .sidebar-link:active { background: var(--primary); color: white; border-color: var(--primary); }
        .sidebar-link i { font-size: 1.2rem; width: 25px; text-align: center; }

        #overlay { display: none; position: fixed; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.7); z-index: 1500; backdrop-filter: blur(2px); }

        /* --- Footer --- */
        footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="headerLogo">App<span>Store</span></div>
        <div style="display: flex; gap: 8px;">
            <div class="header-btn" onclick="toggleLayout()"><i class="fas fa-columns"></i></div>
            <div class="header-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></div>
            <div class="header-btn" onclick="openNav()"><i class="fas fa-bars"></i></div>
        </div>
    </header>

    <div id="overlay" onclick="closeNav()"></div>
    <div id="mySidebar" class="sidebar">
        <div class="sidebar-header">
            <img src="" id="sidebarImg" class="sidebar-img">
            <h3 id="sidebarName" style="color:var(--text-main); margin-bottom:5px;">Admin</h3>
            <p id="sidebarBio" style="color:var(--text-muted); font-size:0.8rem; padding:0 20px; line-height:1.4;"></p>
        </div>
        <div id="sidebarLinks"></div>
    </div>

    <div class="hero">
        <h1 id="heroTitle">متجر التطبيقات</h1>
        <p id="heroDesc">مرحباً بك في عالم التطبيقات</p>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن تطبيق أو لعبة...">
        </div>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs-container" id="tabsList"></div>
    </div>

    <div class="grid" id="appsContainer">
        <div style="grid-column: span var(--grid-cols); text-align: center; padding: 50px; color: var(--text-muted);">
            <i class="fas fa-circle-notch fa-spin"></i> جاري التحميل...
        </div>
    </div>

    <footer id="footerTxt">جميع الحقوق محفوظة &copy; 2026</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
            authDomain: "mohammadalboushi-e9231.firebaseapp.com",
            projectId: "mohammadalboushi-e9231",
            databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
            appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // متغيرات
        let allApps = [];
        let allCats = {};
        let currentFilter = 'ALL';

        // 1. جلب الإعدادات
        onValue(ref(db, 'settings'), (snap) => {
            const s = snap.val() || {};
            
            // تطبيق الخط
            if(s.fontFamily) document.documentElement.style.setProperty('--body-font', `'${s.fontFamily}', sans-serif`);
            
            // تطبيق النصوص
            if(s.texts) {
                if(s.texts.siteName) document.getElementById('headerLogo').innerHTML = s.texts.siteName.replace(' ', '<span>') + '</span>';
                if(s.texts.heroTitle) document.getElementById('heroTitle').innerText = s.texts.heroTitle;
                if(s.texts.heroDesc) document.getElementById('heroDesc').innerText = s.texts.heroDesc;
                if(s.texts.searchPlaceholder) document.getElementById('searchInput').placeholder = s.texts.searchPlaceholder;
                if(s.texts.footer) document.getElementById('footerTxt').innerText = s.texts.footer;
                if(s.texts.adminName) document.getElementById('sidebarName').innerText = s.texts.adminName;
            }

            // تطبيق السايدبار
            document.getElementById('sidebarImg').src = s.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
            document.getElementById('sidebarBio').innerText = s.bio || '';
            
            const linksDiv = document.getElementById('sidebarLinks');
            linksDiv.innerHTML = '';
            if(s.links) {
                s.links.forEach(l => {
                    const a = document.createElement('a');
                    a.className = 'sidebar-link';
                    a.href = l.url;
                    a.innerHTML = `<i class="${l.icon || 'fas fa-link'}"></i> ${l.name}`;
                    linksDiv.appendChild(a);
                });
            }
        });

        // 2. جلب الأقسام (مهم جداً للفلترة)
        onValue(ref(db, 'categories'), (snap) => {
            allCats = snap.val() || {};
            renderTabs();
            // إعادة رسم التطبيقات لأن حالة إخفاء القسم قد تكون تغيرت
            renderApps();
        });

        // 3. جلب التطبيقات
        onValue(ref(db, 'apps'), (snap) => {
            const data = snap.val();
            if(data) {
                // تحويل ل Array
                allApps = Object.values(data);
                // الترتيب حسب Order من لوحة التحكم
                allApps.sort((a, b) => (a.order || 0) - (b.order || 0));
                renderApps();
            } else {
                document.getElementById('appsContainer').innerHTML = "<div style='grid-column:span 2; text-align:center;'>لا توجد تطبيقات</div>";
            }
        });

        function renderTabs() {
            const div = document.getElementById('tabsList');
            // ترتيب الأقسام
            const sorted = Object.entries(allCats).sort(([,a], [,b]) => (a.order || 0) - (b.order || 0));
            
            let html = `<button class="tab-btn ${currentFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">🌟 الكل</button>`;
            
            sorted.forEach(([k, v]) => {
                // شرط مهم: لا تعرض القسم في الشريط إذا كان مخفياً
                if(!v.isHidden) {
                    html += `<button class="tab-btn ${currentFilter === k ? 'active' : ''}" onclick="setFilter('${k}')">${v.icon || ''} ${v.name}</button>`;
                }
            });
            div.innerHTML = html;
        }

        window.setFilter = (f) => {
            currentFilter = f;
            renderTabs();
            renderApps();
        };

        function renderApps() {
            const container = document.getElementById('appsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const fragment = document.createDocumentFragment();
            
            let hasResults = false;

            allApps.forEach(app => {
                // 1. هل التطبيق مخفي؟
                if (app.isHidden) return;

                // 2. هل القسم الخاص بالتطبيق مخفي؟ (مهم جداً)
                const catInfo = allCats[app.type];
                if (catInfo && catInfo.isHidden) return;

                // 3. فلترة البحث والقسم
                const matchCat = (currentFilter === 'ALL') || (app.type === currentFilter);
                const matchSearch = app.name.toLowerCase().includes(searchVal);

                if (matchCat && matchSearch) {
                    hasResults = true;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => window.open(app.link, '_blank');
                    
                    card.innerHTML = `
                        <img src="${app.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/564/564619.png'" loading="lazy">
                        <div class="card-title">${app.name}</div>
                        <div class="get-btn">تحميل</div>
                    `;
                    fragment.appendChild(card);
                }
            });

            container.innerHTML = '';
            if(hasResults) {
                container.appendChild(fragment);
            } else {
                container.innerHTML = `<div style="grid-column: span var(--grid-cols); text-align: center; color: var(--text-muted); padding: 40px;">لا توجد نتائج</div>`;
            }
        }

        // بحث فوري
        document.getElementById('searchInput').addEventListener('input', renderApps);

        // --- أدوات الواجهة ---
        let gridCols = localStorage.getItem('grid') || 2;
        document.documentElement.style.setProperty('--grid-cols', gridCols);

        window.toggleLayout = () => {
            gridCols = gridCols >= 3 ? 1 : parseInt(gridCols) + 1;
            document.documentElement.style.setProperty('--grid-cols', gridCols);
            localStorage.setItem('grid', gridCols);
        };

        window.openNav = () => {
            document.getElementById("mySidebar").style.width = "280px";
            document.getElementById("overlay").style.display = "block";
        };
        window.closeNav = () => {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("overlay").style.display = "none";
        };

        window.toggleTheme = () => {
            const b = document.body;
            const i = document.getElementById('themeIcon');
            if(b.hasAttribute('data-theme')) {
                b.removeAttribute('data-theme');
                i.className = 'fas fa-moon';
                localStorage.setItem('theme', 'dark');
            } else {
                b.setAttribute('data-theme', 'light');
                i.className = 'fas fa-sun';
                localStorage.setItem('theme', 'light');
            }
        };

        if(localStorage.getItem('theme') === 'light') window.toggleTheme();

    </script>
</body>
</html>
