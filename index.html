<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Al.Boushi Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- تعريف الألوان للوضعين --- */
        :root {
            /* الوضع الليلي (الافتراضي) */
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255,255,255,0.05);
            --header-bg: rgba(15, 23, 42, 0.95);
        }

        [data-theme="light"] {
            /* الوضع النهاري */
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: rgba(0,0,0,0.1);
            --header-bg: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding-bottom: 50px;
        }

        /* --- الهيدر --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--text-main); }
        .logo span { color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 20px; }

        /* زر التبديل بين الليل والنهار */
        .theme-toggle {
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .menu-btn { font-size: 1.4rem; cursor: pointer; color: var(--text-main); }

        /* --- القائمة الجانبية --- */
        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0;
            background-color: var(--bg-card); overflow-x: hidden; transition: 0.4s;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2); padding-top: 20px;
        }

        .sidebar-header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); margin-bottom: 10px; }
        .sidebar a { padding: 15px 25px; text-decoration: none; font-size: 1rem; color: var(--text-muted); display: flex; align-items: center; border-bottom: 1px solid var(--border); }
        .sidebar a i { width: 35px; font-size: 1.2rem; color: var(--primary); }
        .sidebar a:hover { background: var(--primary); color: white; }
        .sidebar a:hover i { color: white; }

        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 25px; color: var(--text-muted); background: none; border: none; cursor: pointer; }

        /* --- الواجهة والبحث --- */
        .hero { text-align: center; padding: 40px 20px; }
        .search-box { position: relative; max-width: 500px; margin: 0 auto; }
        .search-box input {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            padding: 15px 45px 15px 20px; border-radius: 12px; color: var(--text-main);
            font-family: 'Cairo'; outline: none;
        }
        .search-icon { position: absolute; right: 15px; top: 16px; color: var(--text-muted); }

        /* --- الشبكة والكرت --- */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        .card {
            background: var(--bg-card); border-radius: 16px; padding: 15px; text-decoration: none;
            color: var(--text-main); display: flex; flex-direction: column; align-items: center;
            border: 1px solid var(--border); transition: 0.3s;
        }
        .card img { width: 70px; height: 70px; border-radius: 14px; margin-bottom: 12px; object-fit: cover; }
        .card-title { font-size: 0.9rem; font-weight: 600; text-align: center; margin-bottom: 10px; }
        .get-btn { background: var(--primary); color: white; font-size: 0.8rem; font-weight: bold; padding: 6px 25px; border-radius: 50px; }

        #overlay { position: fixed; display: none; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.5); z-index: 1500; }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.<span>Al.Boushi</span></div>
        <div class="header-actions">
            <div class="theme-toggle" onclick="toggleTheme()">
                <i id="theme-icon" class="fas fa-sun"></i>
            </div>
            <i class="fas fa-bars menu-btn" onclick="openNav()"></i>
        </div>
    </header>

    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="closeNav()">&times;</button>
        <div class="sidebar-header">
            <img src="https://midomido.neocities.org/mohammadalboushi.png" class="profile-img">
            <h3 style="margin:5px 0;">Mohammad Al Boushi</h3>
        </div>
        <a href="https://wa.me/963938624226" target="_blank"><i class="fab fa-whatsapp"></i> واتساب</a>
        <a href="https://www.facebook.com/share/1AZTCywPbC/" target="_blank"><i class="fab fa-facebook"></i> فيسبوك</a>
    </div>
    <div id="overlay" onclick="closeNav()"></div>

    <div class="hero">
        <h1>متجر التطبيقات</h1>
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="ابحث...">
        </div>
    </div>

    <div class="grid" id="container"></div>

    <script>
        // دالة تبديل الوضع
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'light');
            }
        }

        // حفظ خيار المستخدم عند التحديث
        if (localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon').className = 'fas fa-moon';
        }

        function openNav() { document.getElementById("mySidebar").style.width = "280px"; document.getElementById("overlay").style.display = "block"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; document.getElementById("overlay").style.display = "none"; }

        // كود جلب البيانات (استخدم رابطك الجديد هنا)
        const csvUrl = "https://docs.google.com/spreadsheets/d/1CIJMAArhiP3jlYAs6s4-lCn4CXI6IucLQKwPpJqzRd4/gviz/tq?tqx=out:csv";
        let allApps = [];

        async function loadApps() {
            try {
                const response = await fetch(csvUrl);
                const text = await response.text();
                const rows = text.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
                const container = document.getElementById('container');
                container.innerHTML = '';
                rows.forEach(col => {
                    const name = col[0]?.replace(/"/g, '').trim();
                    const link = col[1]?.replace(/"/g, '').trim();
                    const img  = col[2]?.replace(/"/g, '').trim();
                    if (name && link && link.includes('http')) {
                        const card = document.createElement('a');
                        card.className = 'card';
                        card.href = link; card.target = '_blank';
                        card.innerHTML = `<img src="${img}"><div class="card-title">${name}</div><div class="get-btn">GET</div>`;
                        container.appendChild(card);
                        allApps.push({ element: card, name: name.toLowerCase() });
                    }
                });
            } catch (e) { console.log("Error"); }
        }
        loadApps();
    </script>
</body>
</html>
