<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>إدارة الديون</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"> 
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="auth-container" class="auth-wrapper">
  <div class="auth-box">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="auth-email" class="auth-input" placeholder="البريد الإلكتروني">
    <input type="password" id="auth-password" class="auth-input" placeholder="كلمة المرور">
    
    <button id="login-btn" class="auth-btn btn-primary">تسجيل دخول</button>
    <button id="signup-btn" class="auth-btn btn-secondary">إنشاء حساب جديد</button>
    
    <p id="auth-message" class="auth-msg"></p>
  </div>
</div>

<div id="container" class="hidden">
  <div id="person-list">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2>الزبائن</h2>
      <button id="logout-btn" style="background: #ef4444; color: white; padding: 5px 10px; border-radius: 8px; font-weight: bold;">تسجيل خروج</button>
    </div>
    <div id="person-actions">
      <button id="archive-btn">🗂️ المحفوظات</button>
      <button id="more-options-btn">⋮</button>
      <div id="more-options-dropdown">
        <button id="change-rate-btn"><span>💲</span> تغيير سعر الصرف</button>
        <button id="export-data-btn"><span>📤</span> تصدير بيانات (نسخ)</button>
        <button id="import-data-btn"><span>📥</span> استيراد بيانات (لصق)</button>
        <button id="clear-all-data-btn"><span>🗑️</span> مسح جميع البيانات</button>
      </div>
    </div>
    <div id="persons-container"></div>
    <button id="add-person-btn">+</button>
  </div>

  <div id="keypad-section">
    <div class="currency-inputs">
      <div id="lbp-section" class="currency-field">
        <span>ليرة</span>
        <div id="lbp-display">0</div>
      </div>
      <div id="usd-section" class="currency-field">
        <span>دولار</span>
        <div id="usd-display">0</div>
      </div>
    </div>
    <div class="keypad"></div>
    <button id="ok-btn">تأكيد العملية</button>
  </div>
</div>

<div id="overlay" class="overlay-base">
  <div id="overlay-content"></div>
</div>

<div id="dialog-overlay" class="overlay-base" style="z-index: 2000;">
  <div id="dialog-box">
    <h3 id="dialog-title">عنوان</h3>
    <p id="dialog-message">رسالة</p>
    <input type="text" id="dialog-input" style="display:none;">
    <textarea id="dialog-textarea" style="display:none;"></textarea>
    <div class="dialog-buttons">
      <button id="dialog-cancel" class="dialog-btn btn-secondary">إلغاء</button>
      <button id="dialog-confirm" class="dialog-btn btn-primary">موافق</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
