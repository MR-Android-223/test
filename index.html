<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>خزنة أسراري (سحابي)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #8b5cf6; --bg: #f9fafb; --text: #374151; --danger: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        
        /* شاشة الدخول */
        #loginOverlay { position: fixed; inset: 0; background: #f0f2f5; z-index: 6000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; width: 100%; max-width: 400px; }
        .google-btn { background: #1a73e8; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; margin-top: 20px; }
        
        /* التطبيق */
        header { height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: white; border-bottom: 1px solid #eee; }
        h1 { margin: 0; font-size: 18px; color: var(--primary); }
        .container { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 15px; max-width: 600px; margin: 0 auto; width: 100%; }
        .app-input { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; font-family: inherit; font-size: 16px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
        .btn-outline { background: white; border: 1px solid var(--primary); color: var(--primary); margin-top: 5px; }

        /* قائمة الخزنة */
        #vaultPage { position: fixed; inset: 0; background: #fff; z-index: 200; display: none; flex-direction: column; }
        .vault-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #vaultList { flex: 1; overflow-y: auto; padding: 20px; }
        .account-card { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee; }
        .email-text { font-weight: bold; display: block; margin-bottom: 5px; }
        .pass-text { font-family: monospace; letter-spacing: 1px; color: #666; background: #eee; padding: 4px 8px; border-radius: 4px; }
        
        .toast { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; opacity: 0; transition: 0.3s; pointer-events: none; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="margin:0 0 10px 0;">🔐 خزنـة أسـراري</h2>
        <p style="color:#666; font-size:14px;">نسخة سحابية آمنة</p>
        <button id="loginBtn" class="google-btn">تسجيل الدخول بجوجل</button>
        <div id="loginStatus" style="margin-top:15px; color:#555; font-size:13px; display:none;">جاري الاتصال...</div>
    </div>
</div>

<header>
    <div onclick="logout()" style="cursor:pointer; font-size:24px;">🚪</div>
    <h1>الخزنة السحابية</h1>
    <div style="width:24px"></div>
</header>

<div class="container">
    <div style="background:#e0f2fe; padding:10px; border-radius:8px; color:#0369a1; font-size:13px; text-align:center;">
        مرحباً <span id="userNameDisplay">...</span> 👋
    </div>

    <input type="text" id="emailInput" class="app-input" placeholder="العنوان / البريد">
    <input type="text" id="passInput" class="app-input" placeholder="كلمة المرور / السر">
    
    <button class="btn btn-primary" onclick="saveAccount()">حفظ في السحابة ☁️</button>
    <button class="btn btn-outline" onclick="openVault()">عرض المحفوظات 📂</button>
</div>

<div id="vaultPage">
    <div class="vault-header">
        <h2 style="margin:0; font-size:18px;">بياناتي</h2>
        <button onclick="closeVault()" style="background:none; border:none; font-size:16px; font-weight:bold; color:var(--primary);">إغلاق</button>
    </div>
    <div id="vaultList">
        <div style="text-align:center; color:#999; margin-top:50px;">جاري تحميل البيانات...</div>
    </div>
</div>

<div id="toast" class="toast">تم الحفظ ✅</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 🔑 بياناتك الجديدة الصحيحة (keyvault)
    const firebaseConfig = {
      apiKey: "AIzaSyB23TcZ_7cC93t5uNMIqvFoniFuI4cqY4E",
      authDomain: "wassouf1997.firebaseapp.com",
      databaseURL: "https://wassouf1997-default-rtdb.firebaseio.com",
      projectId: "wassouf1997",
      storageBucket: "wassouf1997.firebasestorage.app",
      messagingSenderId: "979816526016",
      appId: "1:979816526016:web:008b4a536493f3d4123d25",
      measurementId: "G-W6WBHZFX36"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    let currentUser = null;

    // زر الدخول
    document.getElementById('loginBtn').onclick = () => {
        document.getElementById('loginStatus').style.display = 'block';
        document.getElementById('loginStatus').innerText = "جاري التحويل لصفحة جوجل...";
        signInWithRedirect(auth, provider);
    };

    // مراقب الدخول
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('userNameDisplay').innerText = user.displayName;
            loadData();
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
        }
    });

    // تحميل البيانات
    function loadData() {
        if(!currentUser) return;
        const userRef = ref(db, 'users/' + currentUser.uid + '/accounts');
        onValue(userRef, (snapshot) => {
            const list = document.getElementById('vaultList');
            list.innerHTML = '';
            const data = snapshot.val();
            
            if (!data) {
                list.innerHTML = '<div style="text-align:center; color:#ccc; margin-top:50px;">لا توجد بيانات محفوظة</div>';
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const item = data[key];
                list.innerHTML += `
                    <div class="account-card">
                        <span class="email-text">${item.email}</span>
                        <span class="pass-text">${item.pass}</span>
                    </div>
                `;
            });
        });
    }

    // حفظ البيانات
    window.saveAccount = () => {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passInput').value;
        
        if(!email || !pass) { showToast("يرجى تعبئة الخانات ⚠️"); return; }
        
        const newRef = push(ref(db, 'users/' + currentUser.uid + '/accounts'));
        set(newRef, {
            email: email,
            pass: pass,
            date: Date.now()
        }).then(() => {
            showToast("تم الحفظ بنجاح ✅");
            document.getElementById('emailInput').value = '';
            document.getElementById('passInput').value = '';
        });
    };

    window.logout = () => signOut(auth).then(() => location.reload());
    window.openVault = () => document.getElementById('vaultPage').style.display = 'flex';
    window.closeVault = () => document.getElementById('vaultPage').style.display = 'none';
    
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2000);
    }
</script>
</body>
</html>
