<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة الخزنة (الجديد) 🔐</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        button { background: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        #status { margin-top: 20px; color: #555; font-weight: bold; }
        .user-info { text-align: right; background: #e8f5e9; padding: 15px; margin-top: 20px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">تسجيل دخول Google</h2>
    
    <button id="loginBtn">دخول باستخدام Google</button>
    
    <div id="status">انتظار الإجراء...</div>

    <div id="userData" style="display:none;" class="user-info">
        <p>✅ <strong>تم الاتصال بنجاح!</strong></p>
        <p>👤 الاسم: <span id="userName"></span></p>
        <p>🆔 المعرف: <span id="userId" style="font-family:monospace; font-size:12px;"></span></p>
    </div>

    <button id="logoutBtn" style="background:#db4437; display:none;">تسجيل خروج</button>
</div>

<script type="module">
    // 1. استيراد المكتبات من روابط الويب (CDN) بدلاً من npm
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 2. إعدادات تطبيقك الجديدة (تم التحديث) ✅
    const firebaseConfig = {
      apiKey: "AIzaSyB23TcZ_7cC93t5uNMIqvFoniFuI4cqY4E",
      authDomain: "wassouf1997.firebaseapp.com",
      databaseURL: "https://wassouf1997-default-rtdb.firebaseio.com",
      projectId: "wassouf1997",
      storageBucket: "wassouf1997.firebasestorage.app",
      messagingSenderId: "979816526016",
      appId: "1:979816526016:web:008b4a536493f3d4123d25",
      measurementId: "G-W6WBHZFX36"
    };

    // 3. تهيئة التطبيق
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 4. برمجة الأزرار
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusDiv = document.getElementById('status');

    // عند الضغط على دخول
    loginBtn.onclick = () => {
        statusDiv.innerText = "جاري تحويلك إلى صفحة جوجل...";
        // استخدام Redirect لحل مشاكل الموبايل
        signInWithRedirect(auth, provider);
    };

    // عند الضغط على خروج
    logoutBtn.onclick = () => {
        signOut(auth).then(() => window.location.reload());
    };

    // 5. مراقب حالة الدخول (يعمل تلقائياً عند عودة المستخدم)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // حالة: مسجل دخول
            statusDiv.style.display = 'none';
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            
            document.getElementById('userData').style.display = 'block';
            document.getElementById('userName').innerText = user.displayName;
            document.getElementById('userId').innerText = user.uid;
            
            document.getElementById('title').innerText = "الخزنة مفتوحة 🔓";
        } else {
            // حالة: غير مسجل
            statusDiv.innerText = "أنت غير مسجل دخول.";
            statusDiv.style.display = 'block';
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            document.getElementById('userData').style.display = 'none';
        }
    });
</script>

</body>
</html>
