<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر التطبيقات</title>
    
    <!-- تحميل الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* الألوان الأساسية */
            --bg-body: #0f172a; 
            --bg-gradient: radial-gradient(circle at top, #1e293b, #0f172a);
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --primary: #3b82f6; 
            --card-bg: rgba(30, 41, 59, 0.95);
            --border: rgba(255,255,255,0.08);
            --nav-bg: #0f172a;
            
            /* إعدادات العرض والخط */
            --body-font: 'Cairo', sans-serif;
            --grid-cols: 2; /* القيمة الافتراضية للأعمدة */
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-gradient: radial-gradient(circle at top, #e2e8f0, #f8fafc);
            --text-main: #1e293b; --text-muted: #64748b;
            --primary: #2563eb;
            --card-bg: #ffffff;
            --border: rgba(0,0,0,0.08);
            --nav-bg: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-body); background-image: var(--bg-gradient);
            color: var(--text-main); font-family: var(--body-font); min-height: 100vh; 
            padding-bottom: 40px; overflow-x: hidden; background-attachment: fixed;
            transition: 0.3s ease;
        }
        body.no-scroll { overflow: hidden; }

        /* Header */
        header {
            position: sticky; top: 0; z-index: 1000; background: var(--nav-bg);
            border-bottom: 1px solid var(--border); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .logo { font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; }
        .logo span { color: var(--primary); }
        
        .header-left { display: flex; gap: 10px; align-items: center; } 
        
        .icon-btn { 
            font-size: 1.1rem; cursor: pointer; transition: 0.2s; color: var(--text-main); 
            background: rgba(125,125,125,0.1); width: 38px; height: 38px; 
            display: flex; align-items: center; justify-content: center; border-radius: 10px;
        }
        .icon-btn:active { transform: scale(0.9); }

        /* Hero Section */
        .hero { text-align: center; padding: 30px 20px 10px; }
        .hero h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); font-weight: 800; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6; }

        /* Search */
        .search-container { position: relative; max-width: 500px; margin: 0 auto 20px; }
        .search-box {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border);
            padding: 14px 45px 14px 20px; border-radius: 50px; color: var(--text-main);
            font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .search-icon { position: absolute; right: 20px; top: 16px; color: var(--text-muted); }

        /* Tabs */
        .tabs-wrapper { position: sticky; top: 73px; z-index: 900; padding: 8px 0; margin-bottom: 10px; background: transparent; backdrop-filter: blur(8px); }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding: 5px 20px; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border);
            padding: 8px 20px; border-radius: 50px; cursor: pointer; transition: 0.2s;
            font-family: inherit; font-weight: 700; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); }

        /* App Grid - Responsive Columns */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(var(--grid-cols), 1fr); 
            gap: 12px; padding: 10px 20px; max-width: 1000px; margin: 0 auto; 
            transition: all 0.3s ease;
        }
        
        .card {
            background: var(--card-bg); border-radius: 18px; padding: 15px; 
            text-decoration: none; color: var(--text-main); display: flex; flex-direction: column; 
            align-items: center; border: 1px solid var(--border); position: relative; 
            transition: transform 0.2s, background 0.2s; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .card:active { transform: scale(0.97); }
        
        .mod-badge {
            position: absolute; top: 10px; left: 10px; 
            background: rgba(59, 130, 246, 0.1); color: var(--primary);
            font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: bold;
        }
        
        .heart-btn {
            position: absolute; top: 10px; right: 10px; font-size: 1.1rem; color: var(--text-muted);
            cursor: pointer; z-index: 5; background: none; border: none; padding: 5px; transition: 0.2s;
        }
        .heart-btn.active { color: #ef4444; transform: scale(1.2); }

        .card img { 
            width: 75px; height: 75px; border-radius: 18px; margin-bottom: 12px; 
            object-fit: cover; background: #334155; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .card-title { 
            font-size: 0.9rem; font-weight: 700; text-align: center; margin-bottom: 10px; 
            line-height: 1.3; height: 38px; overflow: hidden; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
        }

        .get-btn {
            background: transparent; color: var(--primary); border: 1.5px solid var(--primary);
            font-size: 0.8rem; font-weight: 700; padding: 6px 0; border-radius: 50px; 
            width: 100%; text-align: center; display: block; transition: 0.2s;
        }
        .card:hover .get-btn { background: var(--primary); color: white; }

        /* Sidebar */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0; background-color: var(--nav-bg); overflow-x: hidden; transition: 0.3s; padding-top: 20px; border-left: 1px solid var(--border); box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
        .sidebar-header { text-align: center; padding-bottom: 20px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 10px; object-fit: cover; background: #334155; }
        .sidebar-link { margin: 10px 20px; padding: 12px 15px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; text-decoration: none; font-size: 0.95rem; color: var(--text-main); display: flex; align-items: center; border: 1px solid var(--border); transition: 0.2s; }
        .sidebar-link:active { background: rgba(59, 130, 246, 0.1); border-color: var(--primary); }
        .sidebar-link i { width: 30px; color: var(--primary); font-size: 1.1rem; }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 25px; color: var(--text-muted); background: none; border: none; cursor: pointer; }
        
        #overlay { position: fixed; display: none; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.6); z-index: 1500; backdrop-filter: blur(3px); }
        
        /* Footer */
        footer { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.8rem; margin-top: 40px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="logo">App<span>Store</span></div>
        <div class="header-left">
            <!-- زر تغيير العرض -->
            <div class="icon-btn" onclick="changeLayout()" title="تغيير العرض">
                <i class="fas fa-columns"></i>
            </div>
            
            <!-- زر الثيم -->
            <div class="icon-btn" onclick="toggleTheme()">
                <i class="fas fa-moon" id="themeBtn"></i>
            </div>

            <!-- زر القائمة -->
            <div class="icon-btn" onclick="openNav()">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="closeNav()">&times;</button>
        <div class="sidebar-header">
            <img src="" alt="Profile" class="profile-img" id="sidebarProfileImg">
            <h3 style="margin:5px 0; color:var(--text-main);">Admin</h3>
            <p id="sidebarBio" style="color:var(--text-muted); font-size:0.8rem; padding:0 20px; line-height:1.4;">
                جاري التحميل...
            </p>
        </div>
        <div id="sidebarLinksContainer"></div>
    </div>
    <div id="overlay" onclick="closeNav()"></div>

    <!-- Main Content -->
    <div class="hero">
        <h1 id="heroTitle">متجر التطبيقات</h1>
        <p id="heroDesc">جاري التحميل...</p>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث هنا...">
        </div>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs-container" id="tabsList"></div>
    </div>

    <div class="grid" id="container">
        <div style="grid-column: span 2; text-align: center; padding: 50px; color: var(--text-muted);">
            <i class="fas fa-circle-notch fa-spin"></i> جاري الاتصال...
        </div>
    </div>

    <footer id="footerText">&copy; 2026 جميع الحقوق محفوظة</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI",
            authDomain: "mohammadalboushi-e9231.firebaseapp.com",
            projectId: "mohammadalboushi-e9231",
            databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/",
            appId: "1:236925802081:web:2e26094ab5ecdf988f3c20"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allAppsData = [];
        let currentCategory = 'ALL';
        let allCats = {};

        // 1. جلب الإعدادات (النصوص، الخطوط، السايدبار)
        onValue(ref(db, 'settings'), (snapshot) => {
            const val = snapshot.val();
            if(val) {
                // تطبيق نوع الخط
                if(val.fontFamily) {
                    document.documentElement.style.setProperty('--body-font', `'${val.fontFamily}', sans-serif`);
                }

                // تطبيق النصوص
                if(val.texts) {
                    if(val.texts.heroTitle) document.getElementById('heroTitle').innerText = val.texts.heroTitle;
                    if(val.texts.heroDesc) document.getElementById('heroDesc').innerText = val.texts.heroDesc;
                    if(val.texts.searchPlaceholder) document.getElementById('searchInput').placeholder = val.texts.searchPlaceholder;
                    if(val.texts.footer) document.getElementById('footerText').innerText = val.texts.footer;
                }

                // تطبيق بيانات السايدبار
                document.getElementById('sidebarProfileImg').src = val.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                document.getElementById('sidebarBio').innerText = val.bio || "";
                
                const linksContainer = document.getElementById('sidebarLinksContainer');
                linksContainer.innerHTML = '';
                if(val.links && Array.isArray(val.links)) {
                    val.links.forEach(link => {
                        let url = link.url;
                        if(url && !url.match(/^[a-zA-Z]+:/)) url = 'https://' + url;

                        const a = document.createElement('a');
                        a.className = 'sidebar-link';
                        a.href = url;
                        a.target = "_blank";
                        a.innerHTML = `<i class="${link.icon || 'fas fa-link'}"></i> ${link.name}`;
                        linksContainer.appendChild(a);
                    });
                }
            }
        });

        // 2. جلب الأقسام
        onValue(ref(db, 'categories'), (snapshot) => {
            const val = snapshot.val();
            if(val) { allCats = val; renderTabs(); renderApps(); } 
        });

        // 3. جلب التطبيقات (مع الترتيب حسب الأدمن)
        onValue(ref(db, 'apps'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                allAppsData = Object.values(data).filter(app => !app.isHidden);
                
                // الترتيب: يعتمد على Order (الذي يتم تحديده في الأدمن بالسحب)
                allAppsData.sort((a, b) => (a.order || 0) - (b.order || 0));
                
                renderApps();
            } else {
                allAppsData = [];
                renderApps();
            }
        });

        function renderTabs() {
            const container = document.getElementById('tabsList');
            const sortedCats = Object.entries(allCats).sort(([,a], [,b]) => (a.order || 0) - (b.order || 0));
            
            let html = `<button class="tab-btn ${currentCategory === 'ALL' ? 'active' : ''}" onclick="filterApps('ALL', this)">🌟 الكل</button>`;
            
            sortedCats.forEach(([key, val]) => {
                if (!val.isHidden) {
                    html += `<button class="tab-btn ${currentCategory === key ? 'active' : ''}" onclick="filterApps('${key}', this)">${val.icon} ${val.name}</button>`;
                }
            });
            
            container.innerHTML = html;
        }

        window.filterApps = (cat, btn) => {
            currentCategory = cat;
            renderTabs(); 
            setTimeout(() => {
                const activeBtn = document.querySelector('.tab-btn.active');
                if(activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }, 100);
            renderApps();
        };

        function renderApps(searchTerm = "") {
            const container = document.getElementById('container');
            const fragment = document.createDocumentFragment();
            const favs = JSON.parse(localStorage.getItem('favorites')) || [];

            const filtered = allAppsData.filter(app => {
                const parentCat = allCats[app.type];
                if (parentCat && parentCat.isHidden) return false;

                const matchCat = (currentCategory === 'ALL') || (app.type === currentCategory);
                const matchSearch = app.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = "<div style='grid-column:span 2; text-align:center; color:gray'>لا توجد نتائج</div>";
                return;
            }

            filtered.forEach(app => {
                let badgeTxt = "APP"; 
                if(allCats[app.type]) badgeTxt = allCats[app.type].name;
                
                const isFav = favs.includes(app.name);
                const heartClass = isFav ? "fa-solid active" : "fa-regular";
                let actionBtnText = (app.link && app.link.includes('http')) ? "فتح" : "تحميل";

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.open(app.link, '_blank');
                
                card.innerHTML = `
                    <span class="mod-badge">${badgeTxt}</span>
                    <button class="heart-btn" onclick="toggleFavorite(this, '${app.name}')">
                        <i class="${heartClass} fa-heart"></i>
                    </button>
                    <img src="${app.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/564/564619.png'" loading="lazy" alt="${app.name}">
                    <div class="card-title">${app.name}</div>
                    <div class="get-btn">${actionBtnText}</div>
                `;
                fragment.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(fragment);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => renderApps(e.target.value));

        // --- Layout Changer (1, 2, 3 Columns) ---
        let currentGrid = localStorage.getItem('userGridCols') || 2;
        document.documentElement.style.setProperty('--grid-cols', currentGrid);

        window.changeLayout = () => {
            currentGrid++;
            if(currentGrid > 3) currentGrid = 1;
            document.documentElement.style.setProperty('--grid-cols', currentGrid);
            localStorage.setItem('userGridCols', currentGrid);
        };

        // --- Theme & Nav ---
        window.toggleTheme = () => {
            const btn = document.getElementById('themeBtn');
            if (document.body.hasAttribute('data-theme')) {
                document.body.removeAttribute('data-theme');
                btn.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.setAttribute('data-theme', 'light');
                btn.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'light');
            }
        };
        if (localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('themeBtn').classList.replace('fa-moon', 'fa-sun');
        }

        window.openNav = () => { document.getElementById("mySidebar").style.width = "280px"; document.getElementById("overlay").style.display = "block"; document.body.classList.add("no-scroll"); };
        window.closeNav = () => { document.getElementById("mySidebar").style.width = "0"; document.getElementById("overlay").style.display = "none"; document.body.classList.remove("no-scroll"); };
        
        window.toggleFavorite = (btn, appName) => {
            event.stopPropagation(); 
            let favs = JSON.parse(localStorage.getItem('favorites')) || [];
            if (favs.includes(appName)) {
                favs = favs.filter(i => i !== appName);
                btn.classList.remove('active');
                btn.classList.replace('fa-solid', 'fa-regular');
            } else {
                favs.push(appName);
                btn.classList.add('active');
                btn.classList.replace('fa-regular', 'fa-solid');
            }
            localStorage.setItem('favorites', JSON.stringify(favs));
        };
    </script>
</body>
</html>
