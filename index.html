<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص الاتصال 🛠️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f0f0; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #4285F4; color: white; border: none; padding: 15px 30px; border-radius: 5px; font-size: 16px; margin-top: 10px; width: 100%; }
        #log { margin-top: 20px; text-align: left; background: #222; color: #0f0; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; min-height: 100px; overflow-y: auto; }
        .error { color: #ff5555; }
    </style>
</head>
<body>

<div class="card">
    <h2>🕵️ فحص تسجيل الدخول</h2>
    <p>اضغط الزر، وراقب الشاشة السوداء في الأسفل.</p>
    
    <button id="loginBtn">تسجيل دخول Google</button>
    <button id="logoutBtn" style="background:#db4437; display:none; margin-top:5px;">تسجيل خروج</button>
    
    <div id="log">بدء النظام...</div>
</div>

<script>
    // نظام كشف الأخطاء البرمجية وطباعتها على الشاشة
    window.onerror = function(msg, url, line) {
        document.getElementById('log').innerHTML += `<br><span class="error">⛔ خطأ برمجي: ${msg}</span>`;
    };
    function log(msg) {
        document.getElementById('log').innerHTML += `<br>> ${msg}`;
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    log("جاري تهيئة فايربيس...");

    // إعداداتك الجديدة (keyvault)
    const firebaseConfig = {
      apiKey: "AIzaSyB23TcZ_7cC93t5uNMIqvFoniFuI4cqY4E",
      authDomain: "wassouf1997.firebaseapp.com",
      databaseURL: "https://wassouf1997-default-rtdb.firebaseio.com",
      projectId: "wassouf1997",
      storageBucket: "wassouf1997.firebasestorage.app",
      messagingSenderId: "979816526016",
      appId: "1:979816526016:web:008b4a536493f3d4123d25",
      measurementId: "G-W6WBHZFX36"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        log("✅ فايربيس جاهز.");

        // فحص نتيجة التحويل (Redirect) لمعرفة سبب الفشل إن وجد
        getRedirectResult(auth)
            .then((result) => {
                if (result) {
                    log("🔄 تم العودة من جوجل بنجاح.");
                    log("👤 المستخدم: " + result.user.displayName);
                }
            }).catch((error) => {
                log("❌ خطأ في التحويل: " + error.message);
            });

        // زر الدخول
        document.getElementById('loginBtn').onclick = () => {
            log("🚀 جاري التحويل لصفحة جوجل...");
            signInWithRedirect(auth, provider);
        };

        // زر الخروج
        document.getElementById('logoutBtn').onclick = () => {
            signOut(auth).then(() => location.reload());
        };

        // مراقب الحالة
        onAuthStateChanged(auth, (user) => {
            if (user) {
                log("✅ حالة الدخول: متصل");
                log("👤 الاسم: " + user.displayName);
                log("🆔 ID: " + user.uid);
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                log("ℹ️ حالة الدخول: غير متصل");
            }
        });

    } catch (e) {
        log("❌ خطأ جسيم: " + e.message);
    }
</script>

</body>
</html>
