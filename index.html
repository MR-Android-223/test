<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر التطبيقات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #0f172a; --bg-gradient: radial-gradient(circle at top, #1e293b, #0f172a);
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --primary: #3b82f6; --card-bg: rgba(30, 41, 59, 0.95);
            --border: rgba(255,255,255,0.08); --nav-bg: #0f172a;
            --body-font: 'Cairo', sans-serif;
            --grid-cols: 2; /* افتراضي */
        }
        [data-theme="light"] {
            --bg-body: #f8fafc; --bg-gradient: radial-gradient(circle at top, #e2e8f0, #f8fafc);
            --text-main: #1e293b; --text-muted: #64748b; --primary: #2563eb;
            --card-bg: #ffffff; --border: rgba(0,0,0,0.08); --nav-bg: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); background-image: var(--bg-gradient); color: var(--text-main); font-family: var(--body-font); min-height: 100vh; padding-bottom: 30px; overflow-x: hidden; background-attachment: fixed; transition: 0.3s; }
        
        header { position: sticky; top: 0; z-index: 1000; background: var(--nav-bg); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .header-left { display: flex; gap: 15px; align-items: center; } 
        .icon-btn { font-size: 1.2rem; cursor: pointer; transition: 0.2s; color: var(--text-main); background: rgba(125,125,125,0.1); padding: 8px; border-radius: 8px; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }

        .hero { text-align: center; padding: 30px 20px 10px; }
        .hero h1 { color: var(--primary); font-weight: 800; margin-bottom: 10px; }
        .search-box { width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid var(--border); padding: 14px 20px; border-radius: 50px; color: var(--text-main); font-family: inherit; outline: none; margin: 0 auto; display: block; }
        
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px; scrollbar-width: none; position: sticky; top: 70px; z-index: 900; background: transparent; backdrop-filter: blur(5px); }
        .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 20px; border-radius: 50px; cursor: pointer; white-space: nowrap; font-weight: bold; flex-shrink: 0; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: 12px; padding: 10px 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 18px; padding: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border); position: relative; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.97); }
        
        .card img { width: 70px; height: 70px; border-radius: 16px; margin-bottom: 10px; object-fit: cover; background: #334155; }
        .card-title { font-size: 0.9rem; font-weight: 700; text-align: center; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; margin-bottom: 8px;}
        .get-btn { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); font-size: 0.8rem; font-weight: 700; padding: 6px 0; border-radius: 50px; width: 100%; text-align: center; }
        
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0; background-color: var(--nav-bg); overflow-x: hidden; transition: 0.3s; padding-top: 20px; border-left: 1px solid var(--border); }
        #overlay { position: fixed; display: none; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.6); z-index: 1500; backdrop-filter: blur(3px); }
        footer { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.8rem; margin-top: 40px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:900; font-size:1.2rem;">App<span>Store</span></div>
        <div class="header-left">
            <!-- زر تغيير العرض -->
            <div class="icon-btn" onclick="changeLayout()"><i class="fas fa-columns"></i></div>
            <div class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="themeBtn"></i></div>
            <div class="icon-btn" onclick="openNav()"><i class="fas fa-bars"></i></div>
        </div>
    </header>

    <div id="mySidebar" class="sidebar">
        <button onclick="closeNav()" style="position:absolute; top:15px; left:20px; background:none; border:none; color:var(--text-muted); font-size:25px;">&times;</button>
        <div style="text-align:center; padding-bottom:20px; border-bottom:1px solid var(--border);">
            <img src="" id="sidebarProfileImg" style="width:90px; height:90px; border-radius:50%; border:3px solid var(--primary); object-fit:cover; margin-bottom:10px;">
            <p id="sidebarBio" style="padding:0 20px; color:var(--text-muted); font-size:0.85rem;"></p>
        </div>
        <div id="sidebarLinksContainer" style="padding-top:10px;"></div>
    </div>
    <div id="overlay" onclick="closeNav()"></div>

    <div class="hero">
        <h1 id="heroTitle">المتجر</h1>
        <p id="heroDesc" style="color:var(--text-muted); margin-bottom:20px;">...</p>
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن تطبيق...">
    </div>

    <div class="tabs-container" id="tabsList"></div>
    <div class="grid" id="container"></div>
    <footer id="footerText">&copy; 2026</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyC_iEb4UhUREVJ2mfj00BounPVaeGQr7wI", authDomain: "mohammadalboushi-e9231.firebaseapp.com", projectId: "mohammadalboushi-e9231", databaseURL: "https://mohammadalboushi-e9231-default-rtdb.firebaseio.com/", appId: "1:236925802081:web:2e26094ab5ecdf988f3c20" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allAppsData = [];
        let allCats = {};
        let currentCat = 'ALL';

        // Load Settings
        onValue(ref(db, 'settings'), s => {
            const v = s.val();
            if(v) {
                if(v.fontFamily) document.documentElement.style.setProperty('--body-font', `'${v.fontFamily}', sans-serif`);
                if(v.texts) {
                    if(v.texts.heroTitle) document.getElementById('heroTitle').innerText = v.texts.heroTitle;
                    if(v.texts.heroDesc) document.getElementById('heroDesc').innerText = v.texts.heroDesc;
                    if(v.texts.footer) document.getElementById('footerText').innerText = v.texts.footer;
                }
                document.getElementById('sidebarProfileImg').src = v.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                document.getElementById('sidebarBio').innerText = v.bio || '';
                const lnk = document.getElementById('sidebarLinksContainer'); lnk.innerHTML='';
                if(v.links) v.links.forEach(l => {
                    lnk.innerHTML += `<a href="${l.url}" target="_blank" style="display:flex; align-items:center; gap:10px; padding:12px 20px; color:var(--text-main); text-decoration:none; border-bottom:1px solid var(--border);"><i class="${l.icon}"></i> ${l.name}</a>`;
                });
            }
        });

        // Load Categories
        onValue(ref(db, 'categories'), s => {
            allCats = s.val() || {};
            renderTabs(); renderApps();
        });

        // Load Apps (Optimized)
        onValue(ref(db, 'apps'), s => {
            const d = s.val();
            if(d) {
                allAppsData = Object.values(d).filter(a => !a.isHidden);
                // الترتيب الافتراضي هنا يعتمد على "order" (الترتيب اليدوي من الأدمن)
                allAppsData.sort((a, b) => (a.order || 0) - (b.order || 0));
                renderApps();
            }
        });

        function renderTabs() {
            const c = document.getElementById('tabsList');
            let h = `<button class="tab-btn ${currentCat==='ALL'?'active':''}" onclick="filter('ALL')">🌟 الكل</button>`;
            Object.entries(allCats).sort(([,a],[,b])=>a.order-b.order).forEach(([k,v])=>{
                if(!v.isHidden) h+=`<button class="tab-btn ${currentCat===k?'active':''}" onclick="filter('${k}')">${v.icon} ${v.name}</button>`;
            });
            c.innerHTML = h;
        }

        window.filter = (c) => { currentCat=c; renderTabs(); renderApps(); }

        function renderApps(q = "") {
            const container = document.getElementById('container');
            const fragment = document.createDocumentFragment();
            
            const filtered = allAppsData.filter(app => {
                const pCat = allCats[app.type];
                if(pCat && pCat.isHidden) return false;
                return (currentCat==='ALL'||app.type===currentCat) && app.name.toLowerCase().includes(q.toLowerCase());
            });

            if(!filtered.length) { container.innerHTML="<div style='grid-column:span 2; text-align:center; color:gray'>لا توجد نتائج</div>"; return; }

            filtered.forEach(app => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.open(app.link, '_blank');
                card.innerHTML = `
                    <div style="position:absolute; top:10px; left:10px; font-size:0.7rem; background:rgba(59,130,246,0.1); color:var(--primary); padding:2px 6px; border-radius:4px;">${allCats[app.type]?.name||'APP'}</div>
                    <img src="${app.img}" loading="lazy" onerror="this.src='https://cdn-icons-png.flaticon.com/512/564/564619.png'">
                    <div class="card-title">${app.name}</div>
                    <div class="get-btn">تحميل</div>
                `;
                fragment.appendChild(card);
            });
            container.innerHTML='';
            container.appendChild(fragment);
        }

        document.getElementById('searchInput').addEventListener('input', e=>renderApps(e.target.value));

        // Layout Logic
        let savedCols = localStorage.getItem('gridCols') || 2;
        document.documentElement.style.setProperty('--grid-cols', savedCols);
        
        window.changeLayout = () => {
            let c = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-cols'));
            c = c >= 3 ? 1 : c + 1;
            document.documentElement.style.setProperty('--grid-cols', c);
            localStorage.setItem('gridCols', c);
        };

        // UI Helpers
        window.openNav = () => { document.getElementById("mySidebar").style.width = "280px"; document.getElementById("overlay").style.display = "block"; };
        window.closeNav = () => { document.getElementById("mySidebar").style.width = "0"; document.getElementById("overlay").style.display = "none"; };
        window.toggleTheme = () => {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            document.body.setAttribute('data-theme', isLight ? '' : 'light');
            document.getElementById('themeBtn').className = isLight ? 'fas fa-moon' : 'fas fa-sun';
            localStorage.setItem('theme', isLight ? 'dark' : 'light');
        };
        if(localStorage.getItem('theme')==='light') toggleTheme();
    </script>
</body>
</html>
