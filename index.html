<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة تسجيل الدخول</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #4285F4; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #status { margin-top: 20px; color: #555; }
        #userData { margin-top: 20px; display: none; background: #e8f5e9; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>اختبار دخول جوجل 🔐</h2>
    <button id="loginBtn">تسجيل الدخول باستخدام Google</button>
    <div id="status">جاري فحص حالة الاتصال...</div>
    
    <div id="userData">
        <p>تم تسجيل الدخول بنجاح! ✅</p>
        <p>الاسم: <span id="userName"></span></p>
        <p>الـ UID: <span id="userId"></span></p>
        <button style="background: #db4437;" id="logoutBtn">تسجيل خروج</button>
    </div>
</div>

<script type="module">
    // 1. الاستيراد (يجب أن يكون في الأعلى دائماً)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 2. إعدادات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyCMLMIUht6Az9R1-kiJeNGVN0BeL1N5rG4",
      authDomain: "wassouf1997.firebaseapp.com",
      databaseURL: "https://wassouf1997-default-rtdb.firebaseio.com",
      projectId: "wassouf1997",
      storageBucket: "wassouf1997.firebasestorage.app",
      messagingSenderId: "979816526016",
      appId: "1:979816526016:web:a0538d0d686bf2ff123d25"
    };

    // 3. التشغيل
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const status = document.getElementById('status');
    const userData = document.getElementById('userData');

    // وظيفة زر الدخول
    loginBtn.onclick = () => {
        status.innerText = "جاري تحويلك إلى جوجل...";
        signInWithRedirect(auth, provider);
    };

    // وظيفة زر الخروج
    logoutBtn.onclick = () => {
        signOut(auth).then(() => window.location.reload());
    };

    // مراقب حالة الدخول
    onAuthStateChanged(auth, (user) => {
        if (user) {
            status.style.display = 'none';
            loginBtn.style.display = 'none';
            userData.style.display = 'block';
            document.getElementById('userName').innerText = user.displayName;
            document.getElementById('userId').innerText = user.uid;
            console.log("User UID:", user.uid);
        } else {
            status.innerText = "أنت غير مسجل دخول حالياً.";
            loginBtn.style.display = 'inline-block';
            userData.style.display = 'none';
        }
    });
</script>

</body>
</html>
