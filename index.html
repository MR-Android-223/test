<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Al.Boushi Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* تعريف المتغيرات للألوان (الوضع الليلي افتراضي) */
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --header-bg: rgba(15, 23, 42, 0.95);
        }

        /* متغيرات الوضع النهاري */
        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --header-bg: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* الهيدر */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--header-bg);
            backdrop-filter: blur(8px); /* تخفيف البلور */
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* اللوغو المعدل */
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
            direction: ltr; /* لجعل الاسم بالانجليزي يظهر بشكل صحيح */
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .logo .m-letter { color: var(--primary); font-size: 1.6rem; }
        .logo .boushi { color: var(--text-main); }

        /* أزرار الهيدر */
        .icon-btn {
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-main);
            transition: 0.2s;
            padding: 5px;
        }
        .icon-btn:hover { color: var(--primary); transform: scale(1.1); }

        /* القائمة الجانبية */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            right: 0;
            background-color: #111827; /* دائماً داكن للقائمة */
            overflow-x: hidden;
            transition: 0.3s;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            padding-top: 20px;
        }

        .sidebar-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            margin-bottom: 10px;
            background-color: #1f2937;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 1rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .sidebar a i { width: 35px; font-size: 1.2rem; color: var(--primary); }
        .sidebar a:hover { background: rgba(59, 130, 246, 0.1); color: white; padding-right: 35px; }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 25px;
            color: #94a3b8;
            background: none;
            border: none;
            cursor: pointer;
        }

        #overlay {
            position: fixed; display: none; width: 100%; height: 100%; top: 0; left: 0;
            background: rgba(0,0,0,0.6); z-index: 1500;
        }

        /* القسم الرئيسي */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.08), transparent 60%);
        }

        .hero h1 { margin: 0 0 10px; font-size: 1.8rem; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }

        /* الإحصائيات */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-item {
            text-align: center;
            background: var(--bg-card);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .stat-num { font-weight: 800; color: var(--primary); font-size: 1.2rem; display: block; }
        .stat-lbl { font-size: 0.8rem; color: var(--text-muted); }

        /* البحث */
        .search-box {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }
        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 15px 45px 15px 20px;
            border-radius: 50px;
            color: var(--text-main);
            font-family: 'Cairo';
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            box-shadow: var(--shadow);
        }
        .search-box input:focus { border-color: var(--primary); }
        .search-icon { position: absolute; right: 20px; top: 16px; color: var(--text-muted); }

        /* الشبكة */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 10px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        /* الكرت */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 15px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow);
        }
        
        /* إزالة التأثيرات الثقيلة والاكتفاء بالحركة البسيطة */
        .card:active { transform: scale(0.97); }

        .mod-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* زر القلب */
        .heart-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.1rem;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 5;
            transition: 0.2s;
            background: transparent;
            border: none;
        }
        .heart-btn.active { color: #ef4444; transform: scale(1.1); }

        .card img {
            width: 75px;
            height: 75px;
            border-radius: 16px;
            margin-bottom: 12px;
            object-fit: cover;
            background: #0f172a;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.3;
            height: 38px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .get-btn {
            background: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 25px;
            border-radius: 50px;
            transition: 0.3s;
        }
        .card:hover .get-btn { background: var(--primary); color: white; border-color: var(--primary); }

        .status { grid-column: span 2; text-align: center; color: var(--text-muted); margin-top: 20px; }
        
        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 30px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <!-- اللوغو كما طلبت -->
        <div class="logo">
            <span class="m-letter">M</span>
            <span class="boushi">.Al.Boushi</span>
        </div>

        <div class="header-left">
            <!-- زر تبديل الوضع (شمس/قمر) -->
            <i class="fas fa-moon icon-btn" id="themeBtn" onclick="toggleTheme()"></i>
            <!-- زر القائمة -->
            <i class="fas fa-bars icon-btn" onclick="openNav()"></i>
        </div>
    </header>

    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="closeNav()">&times;</button>
        
        <div class="sidebar-header">
            <img src="https://midomido.neocities.org/mohammadalboushi.png" alt="Mohammad Al Boushi" class="profile-img">
            <h3 style="margin:5px 0; color:white; font-size:1.1rem;">Mohammad Al Boushi</h3>
            <span style="color: var(--text-muted); font-size: 0.8rem;">Admin & Developer</span>
        </div>

        <a href="https://wa.me/963938624226" target="_blank"><i class="fab fa-whatsapp" style="color:#25D366;"></i> واتساب</a>
        <a href="https://www.facebook.com/share/1AZTCywPbC/" target="_blank"><i class="fab fa-facebook" style="color:#1877F2;"></i> فيسبوك</a>
        <a href="https://www.instagram.com/m_al_boushi" target="_blank"><i class="fab fa-instagram" style="color:#E4405F;"></i> انستغرام</a>
        <a href="tel:+963938624226"><i class="fas fa-phone"></i> اتصال هاتفي</a>
        <a href="https://wa.me/963938624226?text=مرحباً، أريد طلب تطبيق..." target="_blank" style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.1); color:#fbbf24;">
            <i class="fas fa-crown"></i> اطلب تطبيق خاص
        </a>
    </div>
    <div id="overlay" onclick="closeNav()"></div>

    <div class="hero">
        <h1>متجر التطبيقات</h1>
        <p>التطبيقات المعدلة والمدفوعة بين يديك</p>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-num" id="appCount">0</span>
                <span class="stat-lbl">تطبيق</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">5K+</span> <!-- الرقم المعدل -->
                <span class="stat-lbl">تنزيل</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">4.9</span>
                <span class="stat-lbl">تقييم</span>
            </div>
        </div>

        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن تطبيق أو لعبة...">
        </div>
    </div>

    <div class="grid" id="container">
        <div class="status">جاري الاتصال بالسيرفر...</div>
    </div>

    <footer>
        &copy; 2026 M.Al.Boushi Store - جميع الحقوق محفوظة
    </footer>

    <script>
        /* --- 1. كود الوضع الليلي/النهاري --- */
        const themeBtn = document.getElementById('themeBtn');
        
        // التحقق من الوضع المحفوظ
        if (localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.classList.replace('fa-moon', 'fa-sun');
        }

        function toggleTheme() {
            if (document.body.hasAttribute('data-theme')) {
                document.body.removeAttribute('data-theme');
                themeBtn.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.setAttribute('data-theme', 'light');
                themeBtn.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'light');
            }
        }

        /* --- 2. كود القائمة --- */
        function openNav() {
            document.getElementById("mySidebar").style.width = "280px";
            document.getElementById("overlay").style.display = "block";
        }
        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("overlay").style.display = "none";
        }

        /* --- 3. نظام المفضلة (القلب) --- */
        function getFavorites() {
            return JSON.parse(localStorage.getItem('favorites')) || [];
        }

        function toggleFavorite(btn, appName) {
            // منع الانتقال للرابط عند ضغط القلب
            event.preventDefault();
            event.stopPropagation();

            let favs = getFavorites();
            if (favs.includes(appName)) {
                favs = favs.filter(item => item !== appName);
                btn.classList.remove('active');
                btn.classList.replace('fa-solid', 'fa-regular');
            } else {
                favs.push(appName);
                btn.classList.add('active');
                btn.classList.replace('fa-regular', 'fa-solid');
            }
            localStorage.setItem('favorites', JSON.stringify(favs));
        }

        /* --- 4. جلب البيانات --- */
        const csvUrl = "https://docs.google.com/spreadsheets/d/1CIJMAArhiP3jlYAs6s4-lCn4CXI6IucLQKwPpJqzRd4/gviz/tq?tqx=out:csv";
        let allApps = [];

        async function loadApps() {
            try {
                const response = await fetch(csvUrl);
                const text = await response.text();
                const rows = text.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
                
                const container = document.getElementById('container');
                container.innerHTML = '';
                
                let count = 0;
                const favs = getFavorites(); // جلب المفضلة الحالية

                rows.forEach(col => {
                    const name = col[0]?.replace(/"/g, '').trim();
                    const link = col[1]?.replace(/"/g, '').trim();
                    const img  = col[2]?.replace(/"/g, '').trim();

                    if (name && link && link.includes('http')) {
                        count++;
                        let btnText = "GET"; 
                        let badgeText = "MOD";
                        let lowerLink = link.toLowerCase();

                        if (lowerLink.endsWith('.pdf')) { btnText = "قراءة"; badgeText = "PDF"; }
                        else if (lowerLink.match(/\.(jpg|png|webp)$/)) { btnText = "مشاهدة"; badgeText = "IMG"; }
                        else if (lowerLink.match(/\.(mp3|wav)$/)) { btnText = "استماع"; badgeText = "AUDIO"; }

                        // التحقق هل هذا التطبيق في المفضلة؟
                        const isFav = favs.includes(name);
                        const heartClass = isFav ? "fa-solid active" : "fa-regular";

                        const card = document.createElement('a');
                        card.className = 'card';
                        card.href = link;
                        card.target = '_blank';
                        
                        card.innerHTML = `
                            <span class="mod-badge">${badgeText}</span>
                            <button class="heart-btn" onclick="toggleFavorite(this, '${name}')">
                                <i class="${heartClass} fa-heart"></i>
                            </button>
                            <img src="${img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/564/564619.png'" loading="lazy">
                            <div class="card-title">${name}</div>
                            <div class="get-btn">${btnText}</div>
                        `;
                        container.appendChild(card);
                        allApps.push({ element: card, name: name.toLowerCase() });
                    }
                });
                
                // تحديث عداد التطبيقات
                document.getElementById('appCount').innerText = count;

            } catch (e) {
                document.getElementById('container').innerHTML = "<div class='status'>تأكد من الاتصال بالإنترنت</div>";
            }
        }

        /* كود البحث */
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            allApps.forEach(app => {
                app.element.style.display = app.name.includes(val) ? 'flex' : 'none';
            });
        });

        loadApps();
    </script>
</body>
</html>
